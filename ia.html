  let sx1=0, sx2=0, sy=0, sx1x1=0, sx2x2=0, sx1x2=0, sx1y=0, sx2y=0;
  for (const p of RM.data) {
    sx1 += p.x1; sx2 += p.x2; sy += p.y;
    sx1x1 += p.x1*p.x1; sx2x2 += p.x2*p.x2; sx1x2 += p.x1*p.x2;
    sx1y += p.x1*p.y; sx2y += p.x2*p.y;
  }
  const A = [[n, sx1, sx2],[sx1, sx1x1, sx1x2],[sx2, sx1x2, sx2x2]];
  const B = [sy, sx1y, sx2y];
  const M = A.map((row, i) => [...row, B[i]]);
  for (let i = 0; i < 3; i++) {
    let maxRow = i;
    for (let k = i+1; k < 3; k++) if (Math.abs(M[k][i]) > Math.abs(M[maxRow][i])) maxRow = k;
    [M[i], M[maxRow]] = [M[maxRow], M[i]];
    for (let k = i+1; k < 3; k++) {
      const f = M[k][i] / M[i][i];
      for (let j = i; j < 4; j++) M[k][j] -= f * M[i][j];
    }
  }
  const x = [0,0,0];
  for (let i = 2; i >= 0; i--) {
    let v = M[i][3];
    for (let j = i+1; j < 3; j++) v -= M[i][j] * x[j];
    x[i] = v / M[i][i];
  }
  return { b: x[0], a1: x[1], a2: x[2] };
}

const NET = {
  nIn: 2, nHidden: 2,
  neurons: [3, 3, 3],
  inputs: [0.6, -0.4, 0.8],
  activation: 'sigmoid',
  weights: [],
  biases: [],
  seed: 42,
  showWeights: true
};
function netRand(seed) {
  let s = seed;
  return function() {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}
function netInitWeights() {
  const rnd = netRand(NET.seed);
  NET.weights = [];
  NET.biases = [];
  const layers = [NET.nIn, ...NET.neurons.slice(0, NET.nHidden), 1];
  for (let l = 1; l < layers.length; l++) {
    const W = [];
    const B = [];
    for (let j = 0; j < layers[l]; j++) {
      const row = [];
      for (let i = 0; i < layers[l-1]; i++) {
        row.push((rnd() * 2 - 1) * 2);
      }
      W.push(row);
      B.push((rnd() * 2 - 1) * 0.5);
    }
    NET.weights.push(W);
    NET.biases.push(B);
  }
}
function netForward() {
  const layers = [NET.inputs.slice(0, NET.nIn)];
  const activations = [NET.inputs.slice(0, NET.nIn)];
  const zs = [];
  for (let l = 0; l < NET.weights.length; l++) {
    const prev = activations[l];
    const z = [], a = [];
    for (let j = 0; j < NET.weights[l].length; j++) {
      let s = NET.biases[l][j];
      for (let i = 0; i < prev.length; i++) s += NET.weights[l][j][i] * prev[i];
      z.push(s);
      a.push(ACTS[NET.activation](s));
    }
    zs.push(z);
    activations.push(a);
  }
  return { activations, zs };
}
function netParamCount() {
  const layers = [NET.nIn, ...NET.neurons.slice(0, NET.nHidden), 1];
  let n = 0;
  for (let l = 1; l < layers.length; l++) n += layers[l-1] * layers[l] + layers[l];
  return n;
}

function drawKNN() {

  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const pad = 20;
  const px = x => pad + x * (W - 2 * pad);
  const py = y => H - pad - y * (H - 2 * pad);
  ctx.fillStyle = '#fafbfc'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#e6eaee'; ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    ctx.beginPath(); ctx.moveTo(pad + i / 10 * (W - 2 * pad), pad); ctx.lineTo(pad + i / 10 * (W - 2 * pad), H - pad); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad, pad + i / 10 * (H - 2 * pad)); ctx.lineTo(W - pad, pad + i / 10 * (H - 2 * pad)); ctx.stroke();

function regStep(steps) {

  for (let s = 0; s < steps; s++) {
    const g = gradJ(REG.a, REG.b);
    REG.a -= REG.alpha * g.ga;
    REG.b -= REG.alpha * g.gb;
    if (!isFinite(REG.a) || !isFinite(REG.b) || Math.abs(REG.a) > 50 || Math.abs(REG.b) > 50) {
      const m = $('#reg-msg'); if (m) { m.className = 'verdict no'; m.textContent = 'Divergence : α est trop grand.'; }
      break;
    }
    REG.path.push({ a: REG.a, b: REG.b, J: Jcost(REG.a, REG.b) });
    if (REG.path.length > 300) REG.path.shift();
  }
  REG.a = Math.max(-1, Math.min(3, REG.a));
  REG.b = Math.max(-2, Math.min(12, REG.b));

function mountPerc(root) {

    + '<div id="perc-act"></div>'
    + '</div>'
    + '</div>'
    + '<h3>Calcul en cours</h3>'

function drawPerc() {

    const el = $('#perc-' + k); if (el) el.value = PERC[k];
    const out = $('#perc-' + k + '-out'); if (out) out.textContent = PERC[k].toFixed(2);

      }, a));
    });
  }
  const canvas = $('#perc-canvas'); if (!canvas) return;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const xmin = -2, xmax = 2, ymin = -2, ymax = 2;
  const pad = 30;
  const sx = x => pad + (x - xmin) / (xmax - xmin) * (W - 2 * pad);

  ctx.beginPath(); ctx.moveTo(sx(0), pad); ctx.lineTo(sx(0), H - pad); ctx.stroke();

    const xa = xmin, ya = -(PERC.w1 * xa + PERC.b) / PERC.w2;
    const xb = xmax, yb = -(PERC.w1 * xb + PERC.b) / PERC.w2;
    ctx.strokeStyle = '#2e6da4'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(sx(xa), sy(ya)); ctx.lineTo(sx(xb), sy(yb)); ctx.stroke();

  ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.stroke();

  const predClass = output > 0.5 ? 1 : 0;
  const comp = $('#perc-compute');
  if (comp) {
    comp.innerHTML = '<table class="dt"><tbody>'
      + '<tr><td>z = w₁·x₁ + w₂·x₂ + b</td><td class="m">= ' + PERC.w1.toFixed(2) + '·' + PERC.x1.toFixed(2) + ' + ' + PERC.w2.toFixed(2) + '·' + PERC.x2.toFixed(2) + ' + ' + PERC.b.toFixed(2) + '</td><td class="m"><b>' + z.toFixed(3) + '</b></td></tr>'
      + '<tr><td>y = φ(z)</td><td class="m">φ = ' + PERC.act + '</td><td class="m"><b>' + output.toFixed(3) + '</b></td></tr>'
      + '<tr><td>Classe prédite</td><td class="m">' + (output > 0.5 ? 'y > 0,5' : 'y ≤ 0,5') + '</td><td class="m"><b>' + predClass + '</b></td></tr>'
      + '</tbody></table>';
  }
  let correct = 0;
  PERC.samples.forEach(s => {
    const zz = PERC.w1 * s.x1 + PERC.w2 * s.x2 + PERC.b;
    const o = ACTS[PERC.act](zz);
    if ((o > 0.5 ? 1 : 0) === s.y) correct++;

  const acc = correct / PERC.samples.length * 100;

  if (stats) {
    stats.innerHTML = '';

      h('div', { class: 'stat' }, h('span', null, 'z'), h('b', null, z.toFixed(3))),
      h('div', { class: 'stat' }, h('span', null, 'y = φ(z)'), h('b', null, output.toFixed(3))),
      h('div', { class: 'stat' }, h('span', null, 'précision'), h('b', null, acc.toFixed(0) + ' %')));
  }
  const msg = $('#perc-msg');
  if (msg) {
    if (acc === 100) { msg.className = 'verdict yes'; msg.textContent = 'Parfait ! Tous les points sont classés correctement.'; }
    else if (acc >= 70) { msg.className = 'verdict warn'; msg.textContent = 'Bien, mais pas parfait. Ajustez w₁, w₂ ou b.'; }
    else { msg.className = 'verdict'; msg.textContent = 'Ajustez w₁, w₂ et b pour déplacer la frontière.'; }
  }
}

function mlpPredict(x1, x2) {
  const k = MLP.k, K = MLP.K;
  const h1 = 1 / (1 + Math.exp(-k * (x1 + x2 - MLP.c1)));
  const h2 = 1 / (1 + Math.exp(-k * (x1 + x2 - MLP.c2)));
  return { h1, h2, y: 1 / (1 + Math.exp(-K * (h1 - h2 - 0.4))) };
}

function drawActs() {
  const canvas = $('#mlp-acts'); if (!canvas) return;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fafbfc'; ctx.fillRect(0, 0, W, H);
  const pad = 24;
  const xmin = -5, xmax = 5;
  const sx = x => pad + (x - xmin) / (xmax - xmin) * (W - 2 * pad);
  const sy = y => H - pad - (y + 1.5) / 2.5 * (H - 2 * pad);
  ctx.strokeStyle = '#8a929c'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, sy(0)); ctx.lineTo(W - pad, sy(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx(0), pad); ctx.lineTo(sx(0), H - pad); ctx.stroke();
  const fns = [
    { name: 'Sigmoïde', f: z => 1 / (1 + Math.exp(-z)), color: '#2e6da4' },
    { name: 'Tanh', f: z => Math.tanh(z), color: '#1e7a2e' },
    { name: 'ReLU', f: z => Math.max(0, z), color: '#c0281f' }
  ];
  fns.forEach((fn, idx) => {
    ctx.strokeStyle = fn.color; ctx.lineWidth = 2.2;
    ctx.beginPath();
    let first = true;
    for (let i = 0; i <= 100; i++) {
      const x = xmin + (xmax - xmin) * i / 100;
      const y = fn.f(x);
      const px = sx(x), py = sy(y);
      if (first) { ctx.moveTo(px, py); first = false; }
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.fillStyle = fn.color;
    ctx.font = 'bold 11px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(fn.name, 8 + idx * 100, pad + 12);
  });
}

function drawNetInter() {
  const canvas = $('#net-canvas'); if (!canvas) return;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fafbfc'; ctx.fillRect(0, 0, W, H);
  const layers = [NET.nIn, ...NET.neurons.slice(0, NET.nHidden), 1];
  const nCols = layers.length;
  const M = 70, MT = 40, MB = 40;
  const xStep = nCols > 1 ? (W - 2 * M) / (nCols - 1) : 0;
  const fwd = netForward();
  const allActivations = fwd.activations;
  const positions = [];
  layers.forEach((count, col) => {
    const positions_col = [];
    const usableH = H - MT - MB;
    const spacing = count > 1 ? usableH / (count + 1) : usableH / 2;
    for (let i = 0; i < count; i++) {
      const x = M + col * xStep;
      const y = MT + spacing * (i + 1);
      positions_col.push({ x, y });
    }
    positions.push(positions_col);
  });
  for (let l = 0; l < NET.weights.length; l++) {
    const from = positions[l];
    const to = positions[l + 1];
    for (let j = 0; j < NET.weights[l].length; j++) {
      for (let i = 0; i < NET.weights[l][j].length; i++) {
        const w = NET.weights[l][j][i];
        const a = from[i], b = to[j];
        const sign = w >= 0 ? '#2e6da4' : '#c0281f';
        ctx.strokeStyle = sign;
        ctx.globalAlpha = Math.min(0.9, 0.25 + Math.abs(w) * 0.25);
        ctx.lineWidth = 0.8 + Math.abs(w) * 1.2;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.globalAlpha = 1;
        if (NET.showWeights && Math.abs(w) > 0.1) {
          const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          ctx.fillStyle = w >= 0 ? '#1b4a76' : '#8a1c14';
          ctx.font = '9.5px "IBM Plex Mono", monospace';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillRect(mx - 13, my - 6, 26, 12);
          ctx.fillStyle = '#fff';
          ctx.fillText(w.toFixed(1), mx, my);
        }
      }
    }
  }
  const actLabel = { sigmoid: 'σ', tanh: 'tanh', relu: 'ReLU', step: 'step' };
  layers.forEach((count, col) => {
    positions[col].forEach((pos, i) => {
      const val = allActivations[col][i];
      let r, g, bl;
      if (col === 0) { r = 220; g = 230; bl = 245; }
      else {
        const t = Math.max(0, Math.min(1, (val + 1) / 2));
        r = Math.round(255 * (1 - t) + 46 * t);
        g = Math.round(200 * (1 - t) + 122 * t);
        bl = Math.round(200 * (1 - t) + 164 * t);
      }
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 15, 0, Math.PI * 2);
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + bl + ')';
      ctx.fill();
      ctx.strokeStyle = col === layers.length - 1 ? '#9a5b00' : '#3f4750';
      ctx.lineWidth = col === layers.length - 1 ? 2.2 : 1.5;
      ctx.stroke();
      ctx.fillStyle = '#111';
      ctx.font = 'bold 10px "IBM Plex Mono", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(val.toFixed(2), pos.x, pos.y + 22);
    });
    const label = col === 0 ? 'entrée (n=' + count + ')' : col === layers.length - 1 ? 'sortie (n=' + count + ')' : 'cachée ' + col + ' (n=' + count + ')';
    ctx.fillStyle = '#5a6068';
    ctx.font = 'bold 11px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, positions[col][0].x, MT - 20);
  });
  NET.biases.forEach((biases, l) => {
    biases.forEach((b, j) => {
      const p = positions[l + 1][j];
      ctx.fillStyle = '#5a6068';
      ctx.font = '9px "IBM Plex Mono", monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('b=' + b.toFixed(2), p.x + 18, p.y);
    });
  });
}
function renderNetForward() {
  const box = $('#net-forward'); if (!box) return;
  box.innerHTML = '';
  const fwd = netForward();
  const layers = [NET.inputs.slice(0, NET.nIn), ...fwd.activations.slice(1)];
  const rows = [];
  layers.forEach((A, l) => {
    if (l === 0) {
      rows.push({ label: 'Entrée', formula: '', out: A.map(v => v.toFixed(3)).join(', ') });
    } else {
      const zs = fwd.zs[l - 1];
      const W = NET.weights[l - 1];
      const prev = layers[l - 1];
      for (let j = 0; j < A.length; j++) {
        let sum = NET.biases[l - 1][j].toFixed(2);
        for (let i = 0; i < prev.length; i++) sum += ' + ' + W[j][i].toFixed(2) + '·' + prev[i].toFixed(2);
        rows.push({
          label: (l === layers.length - 1 ? 'sortie' : 'couche ' + l) + ' · neurone ' + (j + 1),
          formula: 'z = ' + sum + ' = ' + zs[j].toFixed(3) + ' → ' + NET.activation + '(z)',
          out: A[j].toFixed(3)
        });
      }
    }
  });
  const tbody = h('tbody');
  rows.forEach(r => tbody.append(h('tr', null,
    h('td', null, r.label),
    h('td', { class: 'm' }, r.formula),
    h('td', { class: 'm' }, h('b', null, r.out))
  )));
  box.append(h('div', { class: 'dwrap' }, h('table', { class: 'dt' },
    h('thead', null, h('tr', null, ['Couche', 'Calcul', 'Valeur'].map(t => h('th', null, t)))),
    tbody)));
  const final = layers[layers.length - 1][0];
  box.append(h('div', { class: 'verdict yes' },
    'Sortie finale ŷ = <b>' + final.toFixed(4) + '</b> (' + NET.activation + ')'
    + (NET.activation === 'sigmoid' || NET.activation === 'step' ? ' → classe ' + (final > 0.5 ? '1' : '0') : '')));
}

function renderDem() {

  a.innerHTML = '';
  DEM.scenarios.forEach((sc, i) => {

    }, DEM.choices[c])));
    const chipsAlgo = h('div', { class: 'chips' }, ['regmulti', 'knn', 'mlp'].map(c => h('button', {

  });
  const b = $('#dem-b'); if (!b) return;
  b.innerHTML = '';
  DEM.phases.forEach((ph, i) => {

    if (DEM.checkedPhase) {
      const ok = assign === ph.a;
      fb.className = 'fb ' + (ok ? 'ok' : 'no');
      fb.textContent = ok ? '✓' : '✗ Bonne réponse : ' + (ph.a === 'app' ? 'apprentissage' : 'inférence') + '.';
    }
    const chips = h('div', { class: 'chips' }, [
      { v: 'app', l: 'Apprentissage' },
      { v: 'inf', l: 'Inférence' }
    ].map(c => h('button', {
      type: 'button', class: 'chip' + (assign === c.v ? ' on' : ''),
      onclick: () => { if (DEM.checkedPhase) return; DEM.assignPhase[i] = assign === c.v ? null : c.v; renderDem(); }
    }, c.l)));
    b.append(h('div', { class: 'task-row' }, h('div', null, h('span', null, (i + 1) + '. ' + ph.t), fb), chips));
  });

  if (msg && DEM.checked) {
    let ok = 0;
    DEM.scenarios.forEach((sc, i) => { const a = DEM.assign[i] || {}; if (a.type === sc.type && a.algo === sc.algo) ok++; });
    DEM.phases.forEach((ph, i) => { if (DEM.assignPhase[i] === ph.a) ok++; });

    msg.className = 'verdict ' + (ok === total ? 'yes' : 'warn');
    msg.textContent = 'Score : ' + ok + ' / ' + total + '.';
  } else if (msg) {
    msg.className = 'verdict';
    const done = Object.keys(DEM.assign).length + Object.keys(DEM.assignPhase).length;
    msg.textContent = done + ' réponse(s).';
  }
}

<p><b>Convexe</b> : un seul minimum global. Le nombre de points ne change que la courbure.</p>
<h3>Descente de gradient</h3>
<div class="formula">a ← a − α · ∂J/∂a &nbsp;&nbsp; b ← b − α · ∂J/∂b</div>
<h3>Rôle de α</h3>
<ul>
<li>Trop petit → convergence très lente</li>
<li>Trop grand → sauts qui alternent, divergence</li>
</ul>
<div class="retain"><b>À retenir.</b> Coût convexe, α contrôle vitesse et stabilité.</div>
` });
COURSE.push({ id: 'reseau', t: 'Réseaux de neurones', h: `
<h3>Perceptron</h3>
<div class="formula">z = Σ w<sub>i</sub>·x<sub>i</sub> + b &nbsp;&nbsp; y = φ(z)</div>
<h3>Fonctions d'activation</h3>
<table class="ctable"><thead><tr><th>Nom</th><th>Formule</th></tr></thead><tbody>
<tr><td>Sigmoïde</td><td>g(z) = 1 / (1 + e<sup>−z</sup>)</td></tr>
<tr><td>Tanh</td><td>g(z) = (e<sup>z</sup> − e<sup>−z</sup>) / (e<sup>z</sup> + e<sup>−z</sup>)</td></tr>
<tr><td>ReLU</td><td>g(z) = max(0, z)</td></tr>
</tbody></table>
<h3>Architecture</h3>
<ul>
<li>Couche d'entrée : les variables x<sub>i</sub></li>
<li>Couches cachées : neurones intermédiaires</li>
<li>Couche de sortie : la prédiction</li>
<li>Chaque neurone : <b>poids</b> + <b>biais</b></li>
</ul>
<h3>Nombre de paramètres</h3>
<p>Pour un réseau dense avec n_e entrées, n_c couches cachées de n_n neurones, n_s sorties :</p>
<div class="formula">n_param = n_n·n_e + n_n + (n_c − 1)(n_n² + n_n) + n_s·n_n + n_s</div>
<h3>Règle empirique des données</h3>
<p>Pour entraîner un réseau de neurones, on utilise souvent <b>au moins 10× plus d'exemples que de paramètres</b> à apprendre (parfois 30 à 50×). En dessous, risque de <b>surapprentissage</b>.</p>
<div class="formula">n_données ≳ 10 × n_param</div>
<h3>Exemple XOR</h3>
<p>h₁ = σ(k(x₁ + x₂ − c₁)) avec c₁ ≈ 0,5 ; h₂ = σ(k(x₁ + x₂ − c₂)) avec c₂ ≈ 1,5 ; y = σ(K(h₁ − h₂ − 0,4)).</p>
<h3>Prédiction d'angles</h3>
<p>Pour prédire un angle θ périodique, il vaut mieux prédire <b>sin θ et cos θ</b> (continus) puis reconstruire θ. On double le nombre de sorties.</p>
<div class="retain"><b>À retenir.</b> Couches de perceptrons + non-linéarité + rétro-propagation.</div>
` });
COURSE.push({ id: 'backprop', t: 'Rétro-propagation', h: `
<h3>Principe</h3>
<ol>
<li><b>Forward</b> : données de l'entrée vers la sortie.</li>
<li><b>Fonction coût</b> : E = (y − ŷ)².</li>
<li><b>Back-propagation</b> : ∂E/∂wⱼ par composition de dérivées.</li>
<li><b>Descente de gradient</b> : wⱼ ← wⱼ − α·∂E/∂wⱼ.</li>
</ol>
<h3>Chaîne de gradients</h3>
<div class="formula">∂E/∂wⱼ = ∂E/∂ŷ · ∂ŷ/∂h · ∂h/∂f · ∂f/∂wⱼ</div>
<p>Pour une sigmoïde : σ'(z) = σ(z)·(1 − σ(z)).</p>
<h3>Application numérique</h3>
<p>(x, y) = (2, 1), α = 0,1, poids initiaux w₁=0,5, w₂=−1, w₃=−2, w₄=1,5, w₅=1, w₆=1, w₇=−1.</p>
<pre class="code">f11 = w₁ + w₂·x = −1,5      h11 = σ(−1,5) = 0,1824
f12 = w₃·x + w₄ = 1,0        h12 = σ(1,0) = 0,7311
f21 = w₅ + w₆·h11 + w₇·h12 = 0,4513 = ŷ
y − ŷ = 0,5487

Δw₁ = α(y−ŷ)·w₆·h11(1−h11)      = 0,0082
Δw₂ = α(y−ŷ)·w₆·h11(1−h11)·x    = 0,0164
Δw₃ = α(y−ŷ)·w₇·h12(1−h12)·x    = −0,0108
Δw₄ = α(y−ŷ)·w₇·h12(1−h12)      = −0,0216
Δw₅ = α(y−ŷ)                    = 0,0549
Δw₆ = α(y−ŷ)·h11                = 0,0100
Δw₇ = α(y−ŷ)·h12                = 0,0401</pre>
<div class="retain"><b>À retenir.</b> Forward → cost → back → gradient descent.</div>
` });
COURSE.push({ id: 'concours', t: 'Exemples de concours', h: `
<h3>CCINP SI PSI 2025 — friction</h3>
<p>Régression non linéaire par <code>MLPRegressor(hidden_layer_sizes=(600,50))</code>. R² = 0,98 (train) / 0,97 (test). 1481 mesures, 200 test.</p>
<h3>CCINP SI PSI 2025 — λ(θb)</h3>
<p>Régression linéaire par <code>LinearRegression</code>. Modèle global ; moins précis aux basses températures. Kcc = coefficient directeur.</p>
<h3>CCINP TSI SI 2025 — substrats</h3>
<p>Classification A/B. A plus sensible (81,4 %) et plus précis (52,1 %) que B (5,1 % / 17,7 %).</p>
<h3>Concours robotique — modèle géométrique inverse</h3>
<p>Réseau dense n_e → n_c couches de n_n → n_s. Prédiction de sin/cos des angles (continuité) plutôt que θ directement.</p>
<div class="formula">n_param = n_n·n_e + n_n + (n_c−1)(n_n² + n_n) + n_s·n_n + n_s</div>
<p>Sans fonction de perte cinématique, l'erreur reconstruite dépasse 5 m. En minimisant <b>ε(θ) = ||f(θ) − X||²</b> (erreur dans l'espace cartésien), la configuration 5 (32×48) donne une erreur < 5 mm avec un temps de calcul raisonnable.</p>
<p><b>Règle empirique</b> : 10× plus d'exemples que de paramètres (parfois 30-50×).</p>
<div class="retain"><b>À retenir.</b> Les concours testent : type d'IA, lecture de code Scikit-Learn, calcul des indicateurs, dimensionnement du réseau, critique du modèle.</div>
` });
COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Supervisé</dt><dd>Données étiquetées.</dd>
<dt>Non supervisé</dt><dd>Sans étiquettes.</dd>
<dt>Renforcement</dt><dd>Essais-erreurs récompensés.</dd>
<dt>Classification</dt><dd>Prédire une classe.</dd>
<dt>Régression</dt><dd>Prédire une valeur.</dd>
<dt>Clustering</dt><dd>Regrouper sans étiquettes.</dd>
<dt>Surapprentissage</dt><dd>Trop ajusté à l'entraînement.</dd>
<dt>Matrice de confusion</dt><dd>TN / FP / FN / TP.</dd>
<dt>Sensibilité</dt><dd>TP / (TP + FN).</dd>
<dt>Spécificité</dt><dd>TN / (TN + FP).</dd>
<dt>Précision</dt><dd>(TP + TN) / total (ou VP/(VP+FP)).</dd>
<dt>RMSE</dt><dd>Racine de l'erreur quadratique moyenne.</dd>
<dt>Descente de gradient</dt><dd>Minimisation itérative du coût.</dd>
<dt>Hyperparamètre</dt><dd>Fixé avant l'apprentissage (α, k, n_n, n_c…).</dd>
<dt>Perceptron</dt><dd>Somme pondérée + activation.</dd>
<dt>Rétro-propagation</dt><dd>Mise à jour des poids en remontant la sortie.</dd>
<dt>Non paramétrique</dt><dd>Sans nombre fixe de paramètres (k-NN).</dd>
<dt>Apprentissage</dt><dd>Ajustement des paramètres.</dd>
<dt>Inférence</dt><dd>Utilisation du modèle entraîné.</dd>
<dt>Démarche</dt><dd>Décomposer → choisir → entraîner → inférer.</dd>
<dt>MLP</dt><dd>Multi-Layer Perceptron (réseau multicouche).</dd>
<dt>n_param</dt><dd>Nombre de paramètres à apprendre (poids + biais).</dd>
<dt>Règle des 10×</dt><dd>Au moins 10 exemples par paramètre pour éviter le surapprentissage.</dd>
</dl>
` });

/* ============ UI ============ */
const UI = { cur: 'types' };
const AS = { key: 'types', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'intro' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', {
    type: 'button', role: 'tab',
    'aria-pressed': w.id === UI.cur ? 'true' : 'false',
    'aria-selected': w.id === UI.cur ? 'true' : 'false',
    onclick: () => gotoWs(w.id)
  }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  const old = wsById(UI.cur); if (old.leave) old.leave();
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab;
  const keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  if (!a) { box.innerHTML = '<div class="pbody">Aucune activité pour cet atelier.</div>'; return; }
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'QCM (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time));
    body.append(h('div', { class: 'goal', html: '<b>Objectif.</b> ' + a.goal }));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) {
        b.textContent = 'Confirmer ? Votre travail sera effacé';
        AS.arm = setTimeout(() => { b.textContent = 'Recommencer l\'atelier'; AS.arm = null; }, 3500);
        return;
      }
      clearTimeout(AS.arm); AS.arm = null;
      wsById(UI.cur).reset(); mountWs(); renderAct();
    } }, 'Recommencer l\'atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a;
        const bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: (show && s.shown ? j === q.a : s.a[i] === j), disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) {
        const miss = s.a[i] == null && !s.shown;
        fs.append(h('p', { class: 'why', html: (miss ? 'Sans réponse. ' : '') + q.w }));
      }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }
$('#bAct').addEventListener('click', actToggle);

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', {
    type: 'button', class: s.id === cur.id ? 'on' : '',
    'aria-current': s.id === cur.id ? 'true' : 'false',
    onclick: () => go(s.id)
  }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : intelligence artificielle'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l\'atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title },
    h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')),
    h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p><b>Douze ateliers interactifs</b> couvrant le programme officiel de SII CPGE :</p>' +
    '<ul><li>1. Types d\'apprentissage</li>' +
    '<li>2. Représentation des données</li>' +
    '<li>3. Évaluation (binaire + multi-classes)</li>' +
    '<li>4. k plus proches voisins</li>' +
    '<li>5. Régression linéaire monovariable (surface 3D)</li>' +
    '<li>6. Régression linéaire multiple (plan 3D)</li>' +
    '<li>7. Perceptron interactif</li>' +
    '<li>8. Réseau XOR</li>' +
    '<li>9. Réseau interactif (nombre d\'entrées / couches / neurones, activation, propagation, nombre de paramètres)</li>' +
    '<li>10. Démarche de résolution</li>' +
    '<li>11. Exemples de concours (4 sujets : friction, λ(θb), substrats, robotique)</li>' +
    '<li>12. Rétro-propagation (exercices corrigés)</li></ul>' +
    '<h3>Graphiques interactifs</h3><ul>' +
    '<li><b>Surface J(a,b)</b> : glisser pour tourner.</li>' +
    '<li><b>Régression multiple</b> : glisser pour tourner le plan.</li>' +
    '<li><b>Réseau interactif</b> : sliders pour architecture, entrées, poids + nombre de paramètres et règle des 10× données.</li></ul>' +
    '<h3>Vos données</h3><p>Les réponses au QCM sont mémorisées dans ce navigateur uniquement.</p>' }));
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (UI.cur === 'knn') drawKNN();
    else if (UI.cur === 'reg') { drawReg(); drawReg3D(); drawReg2D(); drawRegMultiAlpha(); }
    else if (UI.cur === 'regmulti') drawRM3D();
    else if (UI.cur === 'perc') drawPerc();
    else if (UI.cur === 'mlp') { drawMLP(); drawActs(); }
    else if (UI.cur === 'netinter') drawNetInter();
  }, 120);
});

(function init() {
  AS.open = !isSmall();
  renderSeg();
  mountWs();
  renderAct();
  renderCourse();
})();
</script>
