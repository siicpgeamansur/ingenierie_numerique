<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;--bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;--fg:#111111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#ffffff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;--ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;--violet:#7b4fc2;color-scheme:light}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}.btn.sm{padding:3px 8px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
#stage{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
#scroller{flex:1;min-height:0;overflow:auto}
#ws{padding:16px max(16px,env(safe-area-inset-left,0px)) 30px;max-width:980px}

#ws h4{font-size:13px;margin:0 0 4px;color:var(--muted)}

#ws .small{font-size:12.5px}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.phead b{font-size:15px}.phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:12px;flex:1;min-height:0}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}
input[type=range]{width:100%;padding:0;accent-color:var(--accent)}
textarea.csv{width:100%;font-family:var(--font-mono);font-size:12.5px;min-height:180px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
#act{flex:none;width:clamp(280px,24vw,340px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;max-height:100%}
#act .pbody{font-size:13.5px}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:9px}
.defi{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 12px}.defi p{margin:6px 0}
.defi summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
fieldset.q{border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;margin:0 0 10px}
fieldset.q legend{font-weight:600;padding:0 4px;max-width:100%}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer}
.opt input{margin-top:3px;width:auto;flex:none}
.opt.good{background:rgba(30,122,46,.15)}.opt.bad{background:rgba(192,40,31,.15)}
.why{font-size:12.5px;color:var(--muted);margin:6px 4px 2px}
.score{font-weight:600;font-size:15px;margin:4px 0 8px}
#course{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.ctop,.cwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bar)}
.cwrap{flex:1;min-height:0;display:flex;gap:28px;padding-block:14px}
.ctoc{flex:none;width:250px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ctoc button{display:block;width:100%;text-align:left;padding:6px 10px;border:0;border-left:3px solid transparent;background:transparent;cursor:pointer;font-size:13.5px}
.ctoc button:hover{background:var(--panel2)}
.ctoc button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ctoc-sel{display:none;margin:8px max(16px,env(safe-area-inset-left,0px)) 0;width:auto}
.cbody{flex:1;min-width:0;overflow:auto;max-width:860px;padding-right:6px}
.ckick{color:var(--muted);font-size:12.5px;margin:0}
.cbody h2{font-size:26px;margin:2px 0 12px}
.cbody h3{font-size:16.5px;margin:22px 0 6px}
.cbody p,.cbody li{font-size:14.5px;line-height:1.6}
.cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
.cbody table{display:block;overflow-x:auto;max-width:100%}
.ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
.ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}

.retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}

.gloss{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;font-size:14px}.gloss dt{font-weight:600}.gloss dd{margin:0}
.cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}
.opts{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 10px}.opts .fld{margin:0}
.opts input[type=range]{width:180px;max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}.stat b{font-size:14px;font-family:var(--font-mono);overflow-wrap:anywhere}
.verdict{border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.verdict.yes{background:rgba(30,122,46,.15);border-color:var(--ok)}.verdict.no{background:rgba(192,40,31,.13);border-color:var(--bad)}.verdict.warn{background:rgba(154,91,0,.13);border-color:var(--warn)}
.dwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:8px 0;max-height:340px}
.dt{border-collapse:collapse;width:100%;font-size:13.5px}
.dt th,.dt td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left}
.dt thead th{background:var(--panel2);font-weight:600;position:sticky;top:0}
.dt td.m{font-family:var(--font-mono);font-size:12.5px}
.plot{width:100%;height:auto;display:block;background:#fff;border-radius:8px}
.plot-wrap{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;margin:8px 0}
.plot-legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 2px}
.plot-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0}
.col2 pre.code{margin:0}
.ftbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.ftbox>div{border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13.5px;background:var(--panel);opacity:.55;transition:opacity .15s,background .15s,border-color .15s}
.ftbox>div.on{opacity:1;background:var(--accent-soft);border-color:var(--accent)}
.ftbox b{color:var(--accent-ink)}
@media (max-width:760px){.col2,.ftbox{grid-template-columns:1fr}}
@media (max-width:820px){.ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}#act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28)}.work{flex-direction:column;gap:8px}}

<script>
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
function h(tag,attrs,...kids){const el=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(v===false||v==null)continue;if(k==='class')el.className=v;else if(k==='html')el.innerHTML=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(v===true)el.setAttribute(k,'');else el.setAttribute(k,v);}for(const k of kids.flat())if(k!=null&&k!==false)el.append(k.nodeType?k:document.createTextNode(k));return el;}
const NS='http://www.w3.org/2000/svg';
function sv(tag,attrs,...kids){const el=document.createElementNS(NS,tag);if(attrs)for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);for(const k of kids.flat())if(k!=null)el.append(k);return el;}
function isSmall(){try{return window.matchMedia('(max-width:820px)').matches;}catch(e){return false;}}
const KEYS={act:'sii-num-data-v3'};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const WORKSHOPS=[];
const fmt=(v,d)=>isFinite(v)?(+v).toFixed(d==null?3:d).replace('.',','):'—';
function niceStep(r,t){const raw=r/t;const exp=Math.floor(Math.log10(raw));const base=Math.pow(10,exp);const m=raw/base;if(m<1.5)return base;if(m<3.5)return 2*base;if(m<7.5)return 5*base;return 10*base;}

function plot(W,H,xr,yr){
  const ml=54,mr=16,mt=14,mb=32,iw=W-ml-mr,ih=H-mt-mb;
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,class:'plot'});
  svg.style.width='100%';svg.style.height='auto';svg.style.display='block';
  const toX=x=>ml+(x-xr[0])/(xr[1]-xr[0])*iw,toY=y=>mt+(yr[1]-y)/(yr[1]-yr[0])*ih;
  const g0=sv('g');svg.append(g0);
  const xs=niceStep(xr[1]-xr[0],6),ys=niceStep(yr[1]-yr[0],5);
  for(let x=Math.ceil(xr[0]/xs)*xs;x<=xr[1]+1e-9;x+=xs)g0.append(sv('line',{x1:toX(x),y1:mt,x2:toX(x),y2:mt+ih,stroke:'#e8ebef'}));
  for(let y=Math.ceil(yr[0]/ys)*ys;y<=yr[1]+1e-9;y+=ys)g0.append(sv('line',{x1:ml,y1:toY(y),x2:ml+iw,y2:toY(y),stroke:'#e8ebef'}));
  if(xr[0]<=0&&xr[1]>=0)g0.append(sv('line',{x1:toX(0),y1:mt,x2:toX(0),y2:mt+ih,stroke:'#5a6068'}));
  if(yr[0]<=0&&yr[1]>=0)g0.append(sv('line',{x1:ml,y1:toY(0),x2:ml+iw,y2:toY(0),stroke:'#5a6068'}));
  for(let x=Math.ceil(xr[0]/xs)*xs;x<=xr[1]+1e-9;x+=xs){if(Math.abs(x)<xs*0.01)continue;g0.append(sv('text',{x:toX(x),y:mt+ih+15,'text-anchor':'middle','font-size':11,fill:'#5a6068','font-family':'IBM Plex Mono, monospace'},String(+x.toFixed(2)).replace('.',',')));}
  for(let y=Math.ceil(yr[0]/ys)*ys;y<=yr[1]+1e-9;y+=ys){if(Math.abs(y)<ys*0.01)continue;g0.append(sv('text',{x:ml-5,y:toY(y)+4,'text-anchor':'end','font-size':11,fill:'#5a6068','font-family':'IBM Plex Mono, monospace'},String(+y.toFixed(2)).replace('.',',')));}
  const pg=sv('g');svg.append(pg);
  return{svg,toX,toY,g:pg,mt,mb,ml,mr,iw,ih,xr,yr,
    polyline(pts,color,width,dash){const d=pts.filter(p=>p).map((p,i)=>(i?'L':'M')+toX(p[0]).toFixed(2)+' '+toY(p[1]).toFixed(2)).join(' ');pg.append(sv('path',{d,fill:'none',stroke:color||'#1e7a2e','stroke-width':width||2,'stroke-dasharray':dash||''}));},
    point(x,y,color,r){pg.append(sv('circle',{cx:toX(x),cy:toY(y),r:r||4.5,fill:color||'#c0281f',stroke:'#fff','stroke-width':1.5}));},
    hline(y,color,dash,width){pg.append(sv('line',{x1:ml,y1:toY(y),x2:ml+iw,y2:toY(y),stroke:color||'#9a5b00','stroke-width':width||1.5,'stroke-dasharray':dash||'4 3'}));},
    vline(x,color,dash,width){pg.append(sv('line',{x1:toX(x),y1:mt,x2:toX(x),y2:mt+ih,stroke:color||'#c0281f','stroke-width':width||1.5,'stroke-dasharray':dash||'4 3'}));},
    rect(x0,x1,y0,y1,color){const px0=Math.max(ml,Math.min(ml+iw,toX(x0))),px1=Math.max(ml,Math.min(ml+iw,toX(x1))),py0=Math.max(mt,Math.min(mt+ih,toY(y1))),py1=Math.max(mt,Math.min(mt+ih,toY(y0)));if(px1-px0<0.3)return;pg.append(sv('rect',{x:px0,y:py0,width:px1-px0,height:py1-py0,fill:color||'rgba(46,109,164,0.18)'}));},
    seg(x1,y1,x2,y2,color,width,dash){pg.append(sv('line',{x1:toX(x1),y1:toY(y1),x2:toX(x2),y2:toY(y2),stroke:color||'#7b4fc2','stroke-width':width||2,'stroke-dasharray':dash||''}));},
    text(x,y,str,opts){opts=opts||{};pg.append(sv('text',{x:toX(x),y:toY(y),'text-anchor':opts.anchor||'middle','font-size':opts.size||11,fill:opts.color||'#111','font-family':'IBM Plex Mono, monospace','font-weight':opts.weight||500},str));}
  };
}
function stats(list){return h('div',{class:'gstats'},list.map(k=>h('div',{class:'stat'},h('span',{html:k[0]}),h('b',null,k[1]))));}
function chipsRow(items,cur,cb){return h('div',{class:'chips'},items.map(it=>h('button',{type:'button',class:'chip'+(cur===it[0]?' on':''),onclick:()=>cb(it[0])},it[1])));}
function codeBlockDual(listCode,arrayCode){
  return '<h3>Code Python — deux versions</h3>' +
    '<div class="col2">' +

}
const mean=xs=>xs.reduce((a,b)=>a+b,0)/xs.length;
const variance=xs=>{const m=mean(xs);return xs.reduce((a,b)=>a+(b-m)**2,0)/xs.length;};
const stddev=xs=>Math.sqrt(variance(xs));
function gaussRand(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

/* ============ Atelier 1 : CSV ============ */
const CSV_DEFAULT = `temps;temperature;pression
0;20.0;1.0130
0.5;20.3;1.0131
1;20.7;1.0130
1.5;21.2;1.0132
2;21.7;1.0131

4;23.0;1.0134

const F1 = { col: 1 };
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return { error: 'Pas assez de lignes.' };
  let sep = ';';
  if (!lines[0].includes(';')) { if (lines[0].includes(',')) sep = ','; else if (lines[0].includes('\t')) sep = '\t'; else return { error: 'Séparateur inconnu.' }; }
  const header = lines[0].split(sep).map(s => s.trim());
  const rows = []; let malformed = 0;
  for (let i = 1; i < lines.length; i++) { const cells = lines[i].split(sep).map(s => s.trim()); if (cells.length !== header.length) { malformed++; continue; } rows.push(cells); }
  return { header, rows, sep, malformed };
}
function numericCol(header, rows, colName) {
  const idx = header.indexOf(colName); if (idx < 0) return [];
  const out = [];
  for (const r of rows) { const v = parseFloat(r[idx].replace(',', '.')); if (isFinite(v)) out.push({ t: parseFloat(r[0].replace(',', '.')) || 0, y: v }); }
  return out;
}
const CODE_F1_LIST = `with open("mesures.csv", "r", encoding="utf-8") as f:
    f.readline()                       # ignorer l'en-tête
    temps, temperature, pression = [], [], []
    for ligne in f:
        ligne = ligne.replace(",", ".").strip()
        cellules = ligne.split(";")
        temps.append(float(cellules[0]))
        temperature.append(float(cellules[1]))
        pression.append(float(cellules[2]))

# Calculs directs sur les listes
n = len(temperature)
T_moy = sum(temperature) / n`;
const CODE_F1_NP = `import numpy as np

with open("mesures.csv", "r", encoding="utf-8") as f:
    f.readline()                       # ignorer l'en-tête
    temps, temperature, pression = [], [], []
    for ligne in f:
        ligne = ligne.replace(",", ".").strip()
        cellules = ligne.split(";")
        temps.append(float(cellules[0]))
        temperature.append(float(cellules[1]))
        pression.append(float(cellules[2]))

# Conversion numpy pour la suite
t  = np.array(temps)
T  = np.array(temperature)
P  = np.array(pression)

<p>En SII, on acquiert souvent des mesures dans un fichier texte (<code>.csv</code> ou <code>.txt</code>). Le format CSV (comma-separated values) est le plus courant : une ligne par enregistrement, colonnes séparées par <code>;</code> (France) ou <code>,</code>.</p>

COURSE.push({ id: 'glissante', t: 'Moyenne glissante', h: `
<div class="formula">y[n] = (1/N) Σ<sub>k=0</sub><sup>N−1</sup> x[n−k]</div>
<h3>Effets</h3>
<ul><li>Réduction du bruit : σ divisé par √N (bruit blanc).</li><li>Retard : (N−1)/2 · T<sub>e</sub>.</li><li>Filtre passe-bas (mais lobes secondaires).</li></ul>
<h3>Listes vs numpy</h3>
<div class="col2"><div><h4>Listes</h4><pre class="code">def moyenne_glissante(xs, N):
    out = []
    for n in range(len(xs)):
        if n < N - 1:
            out.append(None)
        else:
            out.append(sum(xs[n-N+1:n+1])/N)
    return out</pre></div><div><h4>numpy</h4><pre class="code">import numpy as np
def moyenne_glissante(xs, N):
    c = np.ones(N) / N
    valid = np.convolve(xs, c, mode='valid')
    return np.concatenate(
        [np.full(N-1, np.nan), valid])</pre></div></div>
<div class="retain"><b>À retenir.</b> Compromis N : lissage vs retard.</div>` });

  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open; if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag; box.innerHTML = '';
  const a = ACT[AS.key];
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), h('button', { class: 'btn sm', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer')));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), h('span', { html: a.goal })));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', onclick: () => openCourse(a.course) }, 'Voir le cours')));
    body.append(h('p', null, h('button', { class: 'btn pri', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', { html: (i + 1) + '. ' + q.q }));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', { html: o + (good ? '  ✓' : '') + (bad ? '  ✗' : '') })));
      });
      if (show) fs.append(h('p', { class: 'why', html: (s.a[i] == null && !s.shown ? 'Sans réponse. ' : '') + q.w }));
      body.append(fs);
    });
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }

function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }

}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });
(function init() { AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); })();
</script>
