<style>

.dt th,.dt td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left}
.dt thead th{background:var(--panel2);font-weight:600;position:sticky;top:0}
.dt td.m{font-family:var(--font-mono);font-size:12.5px}
.plot{width:100%;height:auto;display:block;background:#fff;border-radius:8px}
.plot-wrap{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;margin:8px 0}
.plot-legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 2px}
.plot-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}

.col2 pre.code{margin:0}

@media (max-width:820px){.ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}#act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28)}.work{flex-direction:column;gap:8px}}

<script>
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
function h(tag,attrs,...kids){const el=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(v===false||v==null)continue;if(k==='class')el.className=v;else if(k==='html')el.innerHTML=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(v===true)el.setAttribute(k,'');else el.setAttribute(k,v);}for(const k of kids.flat())if(k!=null&&k!==false)el.append(k.nodeType?k:document.createTextNode(k));return el;}
const NS='http://www.w3.org/2000/svg';
function sv(tag,attrs,...kids){const el=document.createElementNS(NS,tag);if(attrs)for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);for(const k of kids.flat())if(k!=null)el.append(k);return el;}
function isSmall(){try{return window.matchMedia('(max-width:820px)').matches;}catch(e){return false;}}
const KEYS={act:'sii-num-data-v2'};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const WORKSHOPS=[];
const fmt=(v,d)=>isFinite(v)?(+v).toFixed(d==null?3:d).replace('.',','):'—';
function niceStep(r,t){const raw=r/t;const exp=Math.floor(Math.log10(raw));const base=Math.pow(10,exp);const m=raw/base;if(m<1.5)return base;if(m<3.5)return 2*base;if(m<7.5)return 5*base;return 10*base;}
function plot(W,H,xr,yr){
  const ml=52,mr=16,mt=14,mb=32,iw=W-ml-mr,ih=H-mt-mb;
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,class:'plot'});
  svg.style.width='100%';svg.style.height='auto';svg.style.display='block';
  const toX=x=>ml+(x-xr[0])/(xr[1]-xr[0])*iw,toY=y=>mt+(yr[1]-y)/(yr[1]-yr[0])*ih;
  const g0=sv('g');svg.append(g0);
  const xs=niceStep(xr[1]-xr[0],6),ys=niceStep(yr[1]-yr[0],5);
  for(let x=Math.ceil(xr[0]/xs)*xs;x<=xr[1]+1e-9;x+=xs)g0.append(sv('line',{x1:toX(x),y1:mt,x2:toX(x),y2:mt+ih,stroke:'#e8ebef'}));
  for(let y=Math.ceil(yr[0]/ys)*ys;y<=yr[1]+1e-9;y+=ys)g0.append(sv('line',{x1:ml,y1:toY(y),x2:ml+iw,y2:toY(y),stroke:'#e8ebef'}));
  if(xr[0]<=0&&xr[1]>=0)g0.append(sv('line',{x1:toX(0),y1:mt,x2:toX(0),y2:mt+ih,stroke:'#5a6068'}));
  if(yr[0]<=0&&yr[1]>=0)g0.append(sv('line',{x1:ml,y1:toY(0),x2:ml+iw,y2:toY(0),stroke:'#5a6068'}));
  for(let x=Math.ceil(xr[0]/xs)*xs;x<=xr[1]+1e-9;x+=xs){if(Math.abs(x)<xs*0.01)continue;g0.append(sv('text',{x:toX(x),y:mt+ih+15,'text-anchor':'middle','font-size':11,fill:'#5a6068','font-family':'IBM Plex Mono, monospace'},String(+x.toFixed(2)).replace('.',',')));}
  for(let y=Math.ceil(yr[0]/ys)*ys;y<=yr[1]+1e-9;y+=ys){if(Math.abs(y)<ys*0.01)continue;g0.append(sv('text',{x:ml-5,y:toY(y)+4,'text-anchor':'end','font-size':11,fill:'#5a6068','font-family':'IBM Plex Mono, monospace'},String(+y.toFixed(2)).replace('.',',')));}
  const pg=sv('g');svg.append(pg);
  return{svg,toX,toY,g:pg,mt,mb,ml,mr,iw,ih,xr,yr,
    polyline(pts,color,width,dash){const d=pts.filter(p=>p).map((p,i)=>(i?'L':'M')+toX(p[0]).toFixed(2)+' '+toY(p[1]).toFixed(2)).join(' ');pg.append(sv('path',{d,fill:'none',stroke:color||'#1e7a2e','stroke-width':width||2,'stroke-dasharray':dash||''}));},
    point(x,y,color,r){pg.append(sv('circle',{cx:toX(x),cy:toY(y),r:r||4.5,fill:color||'#c0281f',stroke:'#fff','stroke-width':1.5}));},
    hline(y,color,dash,width){pg.append(sv('line',{x1:ml,y1:toY(y),x2:ml+iw,y2:toY(y),stroke:color||'#9a5b00','stroke-width':width||1.5,'stroke-dasharray':dash||'4 3'}));},
    rect(x0,x1,y0,y1,color){const px0=Math.max(ml,Math.min(ml+iw,toX(x0))),px1=Math.max(ml,Math.min(ml+iw,toX(x1))),py0=Math.max(mt,Math.min(mt+ih,toY(y1))),py1=Math.max(mt,Math.min(mt+ih,toY(y0)));if(px1-px0<0.3)return;pg.append(sv('rect',{x:px0,y:py0,width:px1-px0,height:py1-py0,fill:color||'rgba(46,109,164,0.18)'}));},
    seg(x1,y1,x2,y2,color,width,dash){pg.append(sv('line',{x1:toX(x1),y1:toY(y1),x2:toX(x2),y2:toY(y2),stroke:color||'#7b4fc2','stroke-width':width||2,'stroke-dasharray':dash||''}));}
  };
}
function stats(list){return h('div',{class:'gstats'},list.map(k=>h('div',{class:'stat'},h('span',{html:k[0]}),h('b',null,k[1]))));}
function chipsRow(items,cur,cb){return h('div',{class:'chips'},items.map(it=>h('button',{type:'button',class:'chip'+(cur===it[0]?' on':''),onclick:()=>cb(it[0])},it[1])));}

const mean=xs=>xs.reduce((a,b)=>a+b,0)/xs.length;
const variance=xs=>{const m=mean(xs);return xs.reduce((a,b)=>a+(b-m)**2,0)/xs.length;};
const stddev=xs=>Math.sqrt(variance(xs));

/* ============ Atelier 1 : CSV amélioré ============ */
const CSV_DEFAULT = `temps;temperature;pression
0;20.0;1.0130
0.5;20.3;1.0131
1;20.7;1.0130
1.5;21.2;1.0132

const F1 = { col: 1 };
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return { error: 'Pas assez de lignes.' };
  let sep = ';';
  if (!lines[0].includes(';')) { if (lines[0].includes(',')) sep = ','; else if (lines[0].includes('\t')) sep = '\t'; else return { error: 'Séparateur inconnu.' }; }
  const header = lines[0].split(sep).map(s => s.trim());
  const rows = []; let malformed = 0;
  for (let i = 1; i < lines.length; i++) { const cells = lines[i].split(sep).map(s => s.trim()); if (cells.length !== header.length) { malformed++; continue; } rows.push(cells); }
  return { header, rows, sep, malformed };
}
function numericCol(header, rows, colName) {
  const idx = header.indexOf(colName); if (idx < 0) return [];
  const out = [];
  for (const r of rows) { const v = parseFloat(r[idx].replace(',', '.')); if (isFinite(v)) out.push({ t: parseFloat(r[0].replace(',', '.')) || 0, y: v }); }
  return out;
}
const CODE_F1 = `import numpy as np

# Ouverture sécurisée du fichier
with open("mesures.csv", "r", encoding="utf-8") as fichier:
    for _ in range(1):
        fichier.readline()           # ignorer l'en-tête
    temps, tension = [], []
    for ligne in fichier:
        ligne = ligne.replace(",", ".").strip()
        colonnes = ligne.split(";")
        temps.append(float(colonnes[0]))
        tension.append(float(colonnes[1]))

# Conversion numpy pour le traitement
t = np.array(temps)
U = np.array(tension)
U_moy = np.mean(U)`;
function mountF1(root) {
  root.innerHTML = '<h2>Fichiers de données (CSV)</h2>' +
    '<p>Un fichier CSV est un fichier texte : une ligne par enregistrement, des colonnes séparées par un caractère (<code>;</code> en France, <code>,</code> ou tab ailleurs). La première ligne contient les entêtes.</p>' +
    '<h3>Lecture sécurisée avec <code>with open</code></h3>' +
    '<p>Le bloc <code>with</code> est un <b>gestionnaire de contexte</b> : il ouvre le fichier, exécute le code, puis <b>ferme automatiquement</b> le fichier à la sortie du bloc — même en cas d\'exception. On évite ainsi les oublis de <code>close()</code> (fuites de ressources).</p>' +
    '<div class="col2"><div><h3 style="margin-top:0">Sans <code>with</code> (déconseillé)</h3><pre class="code">f = open("donnees.csv", "r")\n# ... lecture ...\nf.close()   # <- on peut oublier</pre></div><div><h3 style="margin-top:0">Avec <code>with</code> (recommandé)</h3><pre class="code">with open("donnees.csv", "r") as f:\n    # ... lecture ...\n# fermé automatiquement ici</pre></div></div>' +
    '<h3>Fichier à analyser</h3>' +
    '<textarea class="csv" id="f1-csv" spellcheck="false"></textarea>' +
    '<div class="files" style="margin:8px 0"><button class="btn" id="f1-reset">Restaurer</button></div>' +
    '<div class="verdict" id="f1-info"></div>' +
    '<div class="fld"><span>Colonne</span><select id="f1-col"></select></div>' +
    '<div class="dwrap" id="f1-table"></div>' +
    '<div class="plot-wrap"><div id="f1-plot"></div></div>' +
    '<div id="f1-stats"></div>' +

/* ============ Atelier 2 : Stats (amélioré listes vs numpy) ============ */
const F2 = { n: 60, mu: 50, sigma: 5, data: null };
function gaussRand() { let u = 0, v = 0; while (u === 0) u = Math.random(); while (v === 0) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function genF2() { F2.data = []; for (let i = 0; i < F2.n; i++) F2.data.push(F2.mu + F2.sigma * gaussRand()); }
const CODE_F2 = `import numpy as np\n\n# --- Listes Python ---\ndef moyenne(liste):\n    n = len(liste)\n    return sum(liste) / n\n\ndef variance(liste):\n    m = moyenne(liste)\n    return sum((x - m)**2 for x in liste) / len(liste)\n\n# --- numpy ---\nx = np.array(mesures)\nx_moy = np.mean(x)\nvar = np.var(x, ddof=0)\nec_type = np.std(x, ddof=0)`;
function mountF2(root) {

    '<p>Moyenne et écart type d\'un échantillon : <b>x̄</b> caractérise le centre, <b>σ</b> la dispersion.</p>' +
    '<div class="formula">x̄ = (1/n)·Σ x<sub>i</sub> &nbsp;·&nbsp; σ² = (1/n)·Σ(x<sub>i</sub> − x̄)² &nbsp;·&nbsp; σ = √σ²</div>' +
    '<div class="opts"><label class="fld"><span>n = <b id="f2-n-out"></b></span><input type="range" id="f2-n" min="5" max="200" step="5"></label><label class="fld"><span>μ = <b id="f2-mu-out"></b></span><input type="range" id="f2-mu" min="0" max="100" step="1"></label><label class="fld"><span>σ = <b id="f2-sig-out"></b></span><input type="range" id="f2-sig" min="0.5" max="20" step="0.5"></label><button class="btn" id="f2-new" style="margin-bottom:9px">Nouveau</button></div>' +
    '<div class="plot-wrap"><div class="plot-legend"><span><i style="background:rgba(46,109,164,0.4)"></i>valeurs</span><span><i style="background:#c0281f"></i>x̄</span><span><i style="background:#9a5b00"></i>x̄ ± σ</span></div><div id="f2-plot"></div></div>' +
    '<div id="f2-stats"></div>' +
    '<h3>Version listes vs numpy</h3>' +
    '<div class="col2"><div><h4 style="margin:0 0 4px">Listes</h4><pre class="code">def moyenne(L):\n    return sum(L)/len(L)\n\ndef variance(L):\n    m = moyenne(L)\n    return sum((x-m)**2 for x in L)/len(L)\n\ndef ecart_type(L):\n    return variance(L)**0.5</pre></div><div><h4 style="margin:0 0 4px">numpy</h4><pre class="code">import numpy as np\nx = np.array(L)\nnp.mean(x)\nnp.var(x)     # ddof=0\nnp.std(x)</pre></div></div>' +
    '<p class="small">Avec <code>ddof=1</code>, numpy calcule la variance d\'échantillon <b>s² = 1/(n−1)·Σ(x−x̄)²</b>.</p>' +
    codeBlock(CODE_F2);
  $('#f2-n').value = F2.n; $('#f2-mu').value = F2.mu; $('#f2-sig').value = F2.sigma;
  $('#f2-n').addEventListener('input', e => { F2.n = +e.target.value; genF2(); drawF2(); });
  $('#f2-mu').addEventListener('input', e => { F2.mu = +e.target.value; genF2(); drawF2(); });
  $('#f2-sig').addEventListener('input', e => { F2.sigma = +e.target.value; genF2(); drawF2(); });
  $('#f2-new').addEventListener('click', () => { genF2(); drawF2(); });
  genF2(); drawF2();
}
function drawF2() {
  $('#f2-n-out').textContent = F2.n; $('#f2-mu-out').textContent = fmt(F2.mu, 1); $('#f2-sig-out').textContent = fmt(F2.sigma, 1);
  $('#f2-n').value = F2.n; $('#f2-mu').value = F2.mu; $('#f2-sig').value = F2.sigma;

/* ============ Atelier 3 : Moyenne glissante ============ */
const F3 = { N: 5, npoints: 120, noise: 1, data: null };
function genF3() { F3.data = []; for (let i = 0; i < F3.npoints; i++) { const t = i * 0.1; F3.data.push(10 + 5 * Math.sin(2 * Math.PI * t / 5) + F3.noise * gaussRand()); } }
function movingAverage(xs, N) {
  const out = [];
  for (let n = 0; n < xs.length; n++) { if (n < N - 1) { out.push(null); continue; } let s = 0; for (let k = 0; k < N; k++) s += xs[n - k]; out.push(s / N); }
  return out;
}
const CODE_F3 = `def moyenne_glissante(xs, N):\n    out = []\n    for n in range(len(xs)):\n        if n < N - 1:\n            out.append(None)\n        else:\n            out.append(sum(xs[n-N+1:n+1])/N)\n    return out`;
function mountF3(root) {
  root.innerHTML = '<h2>Moyenne glissante</h2><p>Filtre passe-bas simple : y[n] = (1/N)·Σ<sub>k=0</sub><sup>N−1</sup> x[n−k]. Retard ≈ (N−1)/2·T<sub>e</sub>.</p>' +
    '<div class="opts"><label class="fld"><span>N = <b id="f3-N-out"></b></span><input type="range" id="f3-N" min="1" max="30" step="1"></label><label class="fld"><span>Bruit σ = <b id="f3-noise-out"></b></span><input type="range" id="f3-noise" min="0" max="3" step="0.1"></label><button class="btn" id="f3-new" style="margin-bottom:9px">Nouveau</button></div>' +
    '<div class="plot-wrap"><div class="plot-legend"><span><i style="background:#c0281f"></i>brut</span><span><i style="background:#2e6da4"></i>lissé</span><span><i style="background:#1e7a2e"></i>tendance</span></div><div id="f3-plot"></div></div>' +
    '<div id="f3-stats"></div><div id="f3-note"></div>' + codeBlock(CODE_F3);
  $('#f3-N').value = F3.N; $('#f3-noise').value = F3.noise;
  $('#f3-N').addEventListener('input', e => { F3.N = +e.target.value; drawF3(); });
  $('#f3-noise').addEventListener('input', e => { F3.noise = +e.target.value; genF3(); drawF3(); });
  $('#f3-new').addEventListener('click', () => { genF3(); drawF3(); });
  genF3(); drawF3();
}
function drawF3() {
  $('#f3-N-out').textContent = F3.N; $('#f3-noise-out').textContent = fmt(F3.noise, 1);
  const xs = F3.data, ys = movingAverage(xs, F3.N);
  const valid = ys.filter(v => v !== null);
  const all = xs.concat(valid);
  const ymin = Math.min(...all), ymax = Math.max(...all), padY = (ymax - ymin) * 0.1 + 0.1;
  const P = plot(640, 300, [0, xs.length * 0.1], [ymin - padY, ymax + padY]);
  const trend = []; for (let n = 0; n < xs.length; n++) { const t = n * 0.1; trend.push([t, 10 + 5 * Math.sin(2 * Math.PI * t / 5)]); }
  P.polyline(trend, '#1e7a2e', 1.5, '5 4');
  P.polyline(xs.map((v, i) => [i * 0.1, v]), '#c0281f', 1.2);

  const sBrut = stddev(xs), sLisse = stddev(valid);
  $('#f3-stats').innerHTML = '';
  $('#f3-stats').append(stats([['N', String(F3.N)], ['σ brut', fmt(sBrut, 3)], ['σ lissé', fmt(sLisse, 3)], ['Réduction', fmt(100 * (1 - sLisse / sBrut), 1) + ' %'], ['Retard', fmt((F3.N - 1) / 2 * 0.1, 2) + ' s']]));

}

/* ============ Atelier 4 : Filtres ============ */
const F4 = { order: 1, fc: 3, Te: 0.01, zeta: 0.7, npoints: 200, noise: 0.05, data: null };
function genF4() { F4.data = []; for (let i = 0; i < F4.npoints; i++) { const t = i * F4.Te; F4.data.push(Math.sin(2 * Math.PI * 1 * t) + 0.5 * Math.sin(2 * Math.PI * 15 * t) + F4.noise * gaussRand()); } }
function filterPB1(xs, Te, fc) { const tau = 1 / (2 * Math.PI * fc), alpha = Math.exp(-Te / tau); const ys = [xs[0]]; for (let n = 1; n < xs.length; n++) ys.push(alpha * ys[n - 1] + (1 - alpha) * xs[n]); return ys; }
function filterPB2(xs, Te, fc, zeta) { const wn = 2 * Math.PI * fc; const a0 = 4/(Te*Te) + 4*zeta*wn/Te + wn*wn, a1 = -8/(Te*Te) + 2*wn*wn, a2 = 4/(Te*Te) - 4*zeta*wn/Te + wn*wn; const b0 = wn*wn, b1 = 2*wn*wn, b2 = wn*wn; const n = xs.length; const y = new Array(n); y[0] = xs[0]; if (n > 1) y[1] = xs[1]; for (let k = 2; k < n; k++) y[k] = (b0*xs[k] + b1*xs[k-1] + b2*xs[k-2] - a1*y[k-1] - a2*y[k-2]) / a0; return y; }
const CODE_F4 = `import math\n\ndef filtre_pb1(xs, Te, fc):\n    tau = 1/(2*math.pi*fc)\n    alpha = math.exp(-Te/tau)\n    ys = [xs[0]]\n    for n in range(1, len(xs)):\n        ys.append(alpha*ys[-1] + (1-alpha)*xs[n])\n    return ys\n\ndef filtre_pb2(xs, Te, fc, zeta=0.7):\n    wn = 2*math.pi*fc\n    a0 = 4/Te**2 + 4*zeta*wn/Te + wn**2\n    a1 = -8/Te**2 + 2*wn**2\n    a2 = 4/Te**2 - 4*zeta*wn/Te + wn**2\n    b0 = wn**2; b1 = 2*wn**2; b2 = wn**2\n    y = [xs[0], xs[1] if len(xs) > 1 else xs[0]]\n    for n in range(2, len(xs)):\n        yn = (b0*xs[n] + b1*xs[n-1] + b2*xs[n-2]\n              - a1*y[n-1] - a2*y[n-2]) / a0\n        y.append(yn)\n    return y`;
function mountF4(root) {
  root.innerHTML = '<h2>Filtres passe-bas numériques</h2><p>1er ordre (pente −20 dB/décade) ou 2e ordre (−40 dB/décade, réglage par ζ).</p>' +
    '<div class="opts"><div class="fld"><span>Ordre</span><div id="f4-order"></div></div><label class="fld"><span>f<sub>c</sub> = <b id="f4-fc-out"></b> Hz</span><input type="range" id="f4-fc" min="0.5" max="10" step="0.1"></label><label class="fld"><span>T<sub>e</sub> = <b id="f4-Te-out"></b> s</span><input type="range" id="f4-Te" min="0.002" max="0.05" step="0.001"></label><label class="fld"><span>ζ = <b id="f4-z-out"></b></span><input type="range" id="f4-z" min="0.1" max="2" step="0.05"></label></div>' +
    '<div class="plot-wrap"><div class="plot-legend"><span><i style="background:#c0281f"></i>brut</span><span><i style="background:#2e6da4"></i>filtré</span></div><div id="f4-plot"></div></div>' +
    '<div id="f4-stats"></div><div id="f4-note"></div>' + codeBlock(CODE_F4);
  $('#f4-order').append(chipsRow([['1', '1er ordre'], ['2', '2e ordre']], String(F4.order), k => { F4.order = +k; drawF4(); }));
  $('#f4-fc').value = F4.fc; $('#f4-Te').value = F4.Te; $('#f4-z').value = F4.zeta;
  $('#f4-fc').addEventListener('input', e => { F4.fc = +e.target.value; drawF4(); });
  $('#f4-Te').addEventListener('input', e => { F4.Te = +e.target.value; genF4(); drawF4(); });
  $('#f4-z').addEventListener('input', e => { F4.zeta = +e.target.value; drawF4(); });
  genF4(); drawF4();
}
function drawF4() {
  $('#f4-fc-out').textContent = fmt(F4.fc, 1); $('#f4-Te-out').textContent = fmt(F4.Te, 3); $('#f4-z-out').textContent = fmt(F4.zeta, 2);
  $('#f4-z').disabled = F4.order !== 2;
  const xs = F4.data, ys = F4.order === 1 ? filterPB1(xs, F4.Te, F4.fc) : filterPB2(xs, F4.Te, F4.fc, F4.zeta);
  const all = xs.concat(ys), ymin = Math.min(...all), ymax = Math.max(...all), padY = (ymax - ymin) * 0.1 + 0.1;
  const P = plot(640, 300, [0, xs.length * F4.Te], [ymin - padY, ymax + padY]);

  $('#f4-note').innerHTML = '';

  if (F4.order === 2) { if (F4.zeta < 0.4) txt += ' ζ = ' + fmt(F4.zeta, 2) + ' : résonance (dépassement).'; else if (F4.zeta > 1) txt += ' ζ > 1 : apériodique.'; else txt += ' ζ ≈ 0,7 : bon compromis.'; }
  $('#f4-note').append(h('div', { class: 'verdict' }, txt));
}

const COURSE = [];
COURSE.push({ id: 'fichiers', t: 'Fichiers de données : lecture sécurisée', h: `
<p>En SII, on acquiert souvent des mesures dans un fichier texte (<code>.csv</code> ou <code>.txt</code>). Le format CSV (comma-separated values) est le plus courant : une ligne par enregistrement, colonnes séparées par <code>;</code> (France) ou <code>,</code>.</p>
<h3>Pourquoi <code>with open</code> ?</h3>
<ul>
<li>C'est un <b>gestionnaire de contexte</b> : il ouvre le fichier, exécute le bloc, puis <b>ferme automatiquement</b> le fichier.</li>
<li>Fermeture garantie <b>même en cas d'exception</b> dans le bloc.</li>
<li>Évite les fuites de ressources (fichiers laissés ouverts par oubli de <code>close()</code>).</li>
</ul>
<div class="col2"><div><h3 style="margin-top:0">Sans <code>with</code> (déconseillé)</h3><pre class="code">f = open("d.csv", "r")
# ... lecture ...
f.close()   # <- on peut oublier</pre></div><div><h3 style="margin-top:0">Avec <code>with</code> (recommandé)</h3><pre class="code">with open("d.csv", "r", encoding="utf-8") as f:
    # ... lecture ...
# fermé automatiquement</pre></div></div>
<h3>Exemple complet</h3>
<pre class="code">import numpy as np

with open("mesures.csv", "r", encoding="utf-8") as fichier:
    for _ in range(2):                # ignorer 2 lignes d'en-tête
        fichier.readline()
    temps, tension = [], []
    for ligne in fichier:
        ligne = ligne.replace(",", ".").strip()
        colonnes = ligne.split(";")
        temps.append(float(colonnes[0]))
        tension.append(float(colonnes[1]))

t = np.array(temps)
U = np.array(tension)
U_moy = np.mean(U)</pre>
<h3>Bonnes pratiques</h3>
<ul>
<li>Toujours <code>with open(...) as f:</code>.</li>
<li>Spécifier <code>encoding="utf-8"</code> (accents, caractères spéciaux).</li>
<li>Nettoyer avant conversion : <code>strip()</code>, <code>replace(",", ".")</code>.</li>
<li>Ignorer les lignes mal formées (mauvais nombre de colonnes).</li>
<li>Convertir en <code>numpy</code> dès que possible.</li>
</ul>
<div class="retain"><b>À retenir.</b> <code>with open</code> = code plus sûr et plus lisible. CSV = fichier texte, séparateur à vérifier, conversion <code>float</code> à faire.</div>` });

COURSE.push({ id: 'stockage', t: 'Listes vs numpy', h: `
<p>Pour stocker une série de mesures, deux structures existent : <b>listes Python</b> et <b>tableaux numpy</b>.</p>
<h3>Listes Python</h3>
<ul><li>Dynamiques : <code>append</code>, <code>pop</code>, <code>insert</code>.</li><li>Hétérogènes.</li><li>Boucles explicites pour les calculs.</li></ul>
<pre class="code">L = [1.2, 3.4, 5.6]
L.append(7.8)
L[1]             # accès
L[1] = 9.9       # modification</pre>
<h3>Tableaux numpy</h3>
<ul><li>Statiques : taille fixée à la création.</li><li>Homogènes (<code>float64</code>).</li><li>Vectorisés : opérations mathématiques directes.</li></ul>
<pre class="code">import numpy as np
t = np.array([1.2, 3.4, 5.6])
t + 2              # vectorisé
np.sin(t)          # vectorisé
t[t &gt; 3]          # filtrage</pre>
<h3>Tableau comparatif</h3>
<table class="ctable"><thead><tr><th>Opération</th><th>Liste</th><th>numpy</th></tr></thead><tbody>
<tr><td>Accès</td><td>O(1)</td><td>O(1)</td></tr>
<tr><td>Ajout en fin</td><td>O(1)</td><td>impossible</td></tr>
<tr><td>Produit terme à terme</td><td>boucle</td><td><code>u * v</code></td></tr>
<tr><td>Moyenne / sinus</td><td>boucle</td><td><code>np.mean</code>, <code>np.sin</code></td></tr>
<tr><td>Filtrage</td><td>boucle + if</td><td><code>u[u &gt; 3]</code></td></tr>
</tbody></table>
<div class="retain"><b>À retenir.</b> Listes pour petites séries dynamiques ; numpy pour tout calcul numérique.</div>` });

COURSE.push({ id: 'stats', t: 'Moyenne et écart type', h: `
<h3>Moyenne</h3>
<div class="formula">x̄ = (1/n) Σ<sub>i=1</sub><sup>n</sup> x<sub>i</sub></div>
<h3>Variance et écart type</h3>
<div class="formula">σ² = (1/n) Σ (x<sub>i</sub> − x̄)² &nbsp;·&nbsp; σ = √σ²</div>
<h3>Listes vs numpy</h3>
<div class="col2"><div><h4 style="margin:0 0 4px">Listes</h4><pre class="code">def moyenne(L):
    return sum(L)/len(L)

def variance(L):
    m = moyenne(L)
    return sum((x-m)**2 for x in L)/len(L)

def ecart_type(L):
    return variance(L)**0.5</pre></div><div><h4 style="margin:0 0 4px">numpy</h4><pre class="code">import numpy as np
x = np.array(L)
np.mean(x)
np.var(x)     # ddof=0
np.std(x)</pre></div></div>
<h3>Bande x̄ ± σ</h3>
<p>Pour une distribution gaussienne :</p>
<ul><li>x̄ ± σ contient environ <b>68 %</b> des valeurs.</li><li>x̄ ± 2σ contient environ <b>95 %</b>.</li><li>x̄ ± 3σ contient environ <b>99,7 %</b>.</li></ul>
<h3>Variance d'échantillon</h3>
<p>Deux formules coexistent :</p>
<ul><li>σ<sub>n</sub>² = (1/n) Σ(x−x̄)² — variance de population (numpy : <code>ddof=0</code>).</li><li>s² = 1/(n−1) Σ(x−x̄)² — variance d'échantillon (numpy : <code>ddof=1</code>).</li></ul>
<div class="retain"><b>À retenir.</b> x̄ = centre, σ = dispersion. numpy : <code>np.mean</code>, <code>np.std</code>, <code>np.var</code>.</div>` });

COURSE.push({ id: 'glissante', t: 'Moyenne glissante', h: `
<div class="formula">y[n] = (1/N) Σ<sub>k=0</sub><sup>N−1</sup> x[n−k]</div>
<h3>Effets</h3>
<ul><li>Réduction du bruit : σ divisé par √N (bruit blanc).</li><li>Retard : (N−1)/2 · T<sub>e</sub>.</li><li>Filtre passe-bas (mais lobes secondaires).</li></ul>
<pre class="code">def moyenne_glissante(xs, N):
    out = []
    for n in range(len(xs)):
        if n < N - 1:
            out.append(None)
        else:
            out.append(sum(xs[n-N+1:n+1])/N)
    return out</pre>
<div class="retain"><b>À retenir.</b> Compromis N : lissage vs retard.</div>` });

COURSE.push({ id: 'filtres', t: 'Filtres passe-bas numériques', h: `
<h3>1er ordre</h3>
<div class="formula">H(p) = 1/(1 + τp) &nbsp;·&nbsp; τ = 1/(2πf<sub>c</sub>)</div>
<p>Pente : −20 dB/décade. Forme discrète exacte :</p>
<div class="formula">y[n] = α·y[n−1] + (1−α)·x[n], α = exp(−T<sub>e</sub>/τ)</div>
<h3>2e ordre</h3>
<div class="formula">H(p) = ω<sub>n</sub>² / (p² + 2ζω<sub>n</sub>p + ω<sub>n</sub>²)</div>
<p>Pente : −40 dB/décade. Discrétisation Tustin :</p>
<div class="formula">y[n] = (b<sub>0</sub>x[n] + b<sub>1</sub>x[n−1] + b<sub>2</sub>x[n−2] − a<sub>1</sub>y[n−1] − a<sub>2</sub>y[n−2]) / a<sub>0</sub></div>
<h3>Rôle de ζ</h3>
<ul><li>ζ = 1 : régime critique.</li><li>ζ &lt; 1 : dépassement.</li><li>ζ ≈ 0,7 : compromis (Butterworth).</li></ul>
<h3>Choix de T<sub>e</sub></h3>
<p>T<sub>e</sub> ≪ 1/f<sub>c</sub> (typiquement 10 à 20× plus petit).</p>
<div class="retain"><b>À retenir.</b> 1er ordre : simple, −20 dB/déc. 2e ordre : −40 dB/déc., ζ règle l'amortissement.</div>` });

/* ---- Interface ---- */
const UI = { cur: 'f1' };
const AS = { key: 'f1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'fichiers' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() { const seg = $('#wsSeg'); seg.innerHTML = ''; WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title))); }
function mountWs() { const w = wsById(UI.cur), root = $('#ws'); $('#hint').textContent = w.hint; root.innerHTML = ''; w.mount(root); $('#scroller').scrollTop = 0; }
function gotoWs(id) { const old = wsById(UI.cur); if (old.leave) old.leave(); if (CS.open) { CS.open = false; renderCourse(); } UI.cur = id; AS.key = id; AS.tab = 'steps'; renderSeg(); mountWs(); renderAct(); }
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open; if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag; box.innerHTML = '';
  const a = ACT[AS.key];
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), h('button', { class: 'btn sm', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer')));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', onclick: () => openCourse(a.course) }, 'Voir le cours')));
    body.append(h('p', null, h('button', { class: 'btn pri', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', { html: (i + 1) + '. ' + q.q }));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', { html: o + (good ? '  ✓' : '') + (bad ? '  ✗' : '') })));
      });
      if (show) fs.append(h('p', { class: 'why', html: (s.a[i] == null && !s.shown ? 'Sans réponse. ' : '') + q.w }));
      body.append(fs);
    });
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }

}

  box.append(h('div', { class: 'ctop' }, h('b', null, 'Cours'), h('button', { class: 'btn pri sm', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour')), sel, h('div', { class: 'cwrap' }, nav, art));
}

$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });
