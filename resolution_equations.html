<style>

.dt{border-collapse:collapse;width:100%;font-size:13.5px}

.dt td.m{font-family:var(--font-mono);font-size:12.5px}
.plot{width:100%;height:auto;display:block;background:#fff;border-radius:8px}
.plot-wrap{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;margin:8px 0}
.plot-legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 2px}
.plot-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.mtx{border-collapse:collapse;font-family:var(--font-mono);font-size:13px;border-left:2px solid var(--fg);border-right:2px solid var(--fg);margin:0 auto}
.mtx td{padding:4px 11px;text-align:right}
.mtx td.piv{background:rgba(46,109,164,0.18);font-weight:600;color:var(--accent-ink)}

.mtx td.sep{border-left:1px solid var(--fg)}
.mtx-wrap{display:flex;justify-content:center;margin:10px 0}
.mtx-cap{font-size:12px;color:var(--muted);text-align:center;margin:2px 0 8px}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0}
.col2 pre.code{margin:0}
@media (max-width:760px){.col2{grid-template-columns:1fr}}
@media (max-width:820px){.ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}#act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}.work{flex-direction:column;gap:8px}.opts input[type=range]{width:140px}}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}}

<div id="app">
  <header class="band"><div class="inner row">
    <div class="brand"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M3 22 L23 4" stroke="var(--accent)" stroke-width="2.5" fill="none"/><circle cx="9" cy="15" r="2.5" fill="var(--bad)"/><circle cx="17" cy="9" r="2.5" fill="var(--ok)"/></svg><span>Méthodes numériques <small>SII · CPGE 1<sup>re</sup> année</small></span></div>

<script>
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
function h(tag,attrs,...kids){const el=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(v===false||v==null)continue;if(k==='class')el.className=v;else if(k==='html')el.innerHTML=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(v===true)el.setAttribute(k,'');else el.setAttribute(k,v);}for(const k of kids.flat())if(k!=null&&k!==false)el.append(k.nodeType?k:document.createTextNode(k));return el;}
const NS='http://www.w3.org/2000/svg';
function sv(tag,attrs,...kids){const el=document.createElementNS(NS,tag);if(attrs)for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);for(const k of kids.flat())if(k!=null)el.append(k);return el;}
function isSmall(){try{return window.matchMedia('(max-width:820px)').matches;}catch(e){return false;}}
const KEYS={act:'sii-num-v4'};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const WORKSHOPS=[];
const fmt=(v,d)=>isFinite(v)?(+v).toFixed(d==null?4:d).replace('.',','):'—';
function niceStep(range,target){const raw=range/target;const exp=Math.floor(Math.log10(raw));const base=Math.pow(10,exp);const m=raw/base;if(m<1.5)return base;if(m<3.5)return 2*base;if(m<7.5)return 5*base;return 10*base;}
function plot(W,H,xr,yr){
  const ml=50,mr=16,mt=14,mb=32,iw=W-ml-mr,ih=H-mt-mb;
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,class:'plot'});
  svg.style.width='100%';svg.style.height='auto';svg.style.display='block';
  const toX=x=>ml+(x-xr[0])/(xr[1]-xr[0])*iw,toY=y=>mt+(yr[1]-y)/(yr[1]-yr[0])*ih;
  const g0=sv('g');svg.append(g0);
  const xs=niceStep(xr[1]-xr[0],6),ys=niceStep(yr[1]-yr[0],5);
  for(let x=Math.ceil(xr[0]/xs)*xs;x<=xr[1]+1e-9;x+=xs)g0.append(sv('line',{x1:toX(x),y1:mt,x2:toX(x),y2:mt+ih,stroke:'#e8ebef','stroke-width':1}));
  for(let y=Math.ceil(yr[0]/ys)*ys;y<=yr[1]+1e-9;y+=ys)g0.append(sv('line',{x1:ml,y1:toY(y),x2:ml+iw,y2:toY(y),stroke:'#e8ebef','stroke-width':1}));
  if(xr[0]<=0&&xr[1]>=0)g0.append(sv('line',{x1:toX(0),y1:mt,x2:toX(0),y2:mt+ih,stroke:'#5a6068','stroke-width':1}));
  if(yr[0]<=0&&yr[1]>=0)g0.append(sv('line',{x1:ml,y1:toY(0),x2:ml+iw,y2:toY(0),stroke:'#5a6068','stroke-width':1}));
  for(let x=Math.ceil(xr[0]/xs)*xs;x<=xr[1]+1e-9;x+=xs){if(Math.abs(x)<xs*0.01)continue;g0.append(sv('text',{x:toX(x),y:mt+ih+15,'text-anchor':'middle','font-size':11,fill:'#5a6068','font-family':'IBM Plex Mono, monospace'},String(+x.toFixed(2)).replace('.',',')));}
  for(let y=Math.ceil(yr[0]/ys)*ys;y<=yr[1]+1e-9;y+=ys){if(Math.abs(y)<ys*0.01)continue;g0.append(sv('text',{x:ml-5,y:toY(y)+4,'text-anchor':'end','font-size':11,fill:'#5a6068','font-family':'IBM Plex Mono, monospace'},String(+y.toFixed(2)).replace('.',',')));}
  g0.append(sv('text',{x:ml+iw,y:mt+ih+28,'text-anchor':'end','font-size':11,fill:'#5a6068'},'x'));
  g0.append(sv('text',{x:ml-30,y:mt+10,'font-size':11,fill:'#5a6068'},'y'));
  const pg=sv('g');svg.append(pg);
  return{svg,toX,toY,g:pg,mt,mb,ml,mr,iw,ih,xr,yr,
    band(x1,x2,color){let px1=Math.max(ml,Math.min(ml+iw,toX(x1)));let px2=Math.max(ml,Math.min(ml+iw,toX(x2)));if(px2<px1)[px1,px2]=[px2,px1];if(px2-px1<0.5)return;pg.append(sv('rect',{x:px1,y:mt,width:px2-px1,height:ih,fill:color||'rgba(46,109,164,0.13)'}));},
    curve(f,color,width){let d='',started=false;const N=240;for(let i=0;i<=N;i++){const x=xr[0]+(xr[1]-xr[0])*i/N;let y=f(x);if(!isFinite(y)){started=false;continue;}if(y<yr[0])y=yr[0];if(y>yr[1])y=yr[1];d+=(started?'L':'M')+toX(x).toFixed(2)+' '+toY(y).toFixed(2)+' ';started=true;}pg.append(sv('path',{d,fill:'none',stroke:color||'#2e6da4','stroke-width':width||2,'stroke-linejoin':'round','stroke-linecap':'round'}));},
    polyline(pts,color,width,dash){const d=pts.filter(p=>p).map((p,i)=>(i?'L':'M')+toX(p[0]).toFixed(2)+' '+toY(p[1]).toFixed(2)).join(' ');pg.append(sv('path',{d,fill:'none',stroke:color||'#1e7a2e','stroke-width':width||2,'stroke-dasharray':dash||''}));},
    point(x,y,color,r,shape){if(shape==='square'){pg.append(sv('rect',{x:toX(x)-(r||3),y:toY(y)-(r||3),width:2*(r||3),height:2*(r||3),fill:color||'#c0281f',stroke:'#fff','stroke-width':1.2}));}else{pg.append(sv('circle',{cx:toX(x),cy:toY(y),r:r||4.5,fill:color||'#c0281f',stroke:'#fff','stroke-width':1.5}));}},
    rect(x1,x2,y1,y2,color){let px1=toX(x1),px2=toX(x2),py1=toY(y1),py2=toY(y2);if(px2<px1)[px1,px2]=[px2,px1];if(py2<py1)[py1,py2]=[py2,py1];pg.append(sv('rect',{x:px1,y:py1,width:px2-px1,height:py2-py1,fill:color||'rgba(46,109,164,0.2)'}));},
    vline(x,color,dash,width){pg.append(sv('line',{x1:toX(x),y1:mt,x2:toX(x),y2:mt+ih,stroke:color||'#c0281f','stroke-width':width||1.5,'stroke-dasharray':dash||'4 3'}));},
    hline(y,color,dash,width){pg.append(sv('line',{x1:ml,y1:toY(y),x2:ml+iw,y2:toY(y),stroke:color||'#9a5b00','stroke-width':width||1.5,'stroke-dasharray':dash||'4 3'}));},
    seg(x1,y1,x2,y2,color,width,dash){pg.append(sv('line',{x1:toX(x1),y1:toY(y1),x2:toX(x2),y2:toY(y2),stroke:color||'#7b4fc2','stroke-width':width||2,'stroke-dasharray':dash||''}));},
    text(x,y,str,opts){opts=opts||{};pg.append(sv('text',{x:toX(x),y:toY(y),'text-anchor':opts.anchor||'middle','font-size':opts.size||11,fill:opts.color||'#111','font-family':'IBM Plex Mono, monospace','font-weight':opts.weight||500},str));}
  };
}
function stats(list){return h('div',{class:'gstats'},list.map(k=>h('div',{class:'stat'},h('span',{html:k[0]}),h('b',null,k[1]))));}
function chipsRow(items,cur,cb,label){return h('div',{class:'chips',role:'group','aria-label':label||''},items.map(it=>h('button',{type:'button',class:'chip'+(cur===it[0]?' on':''),'aria-pressed':cur===it[0]?'true':'false',onclick:()=>cb(it[0])},it[1])));}

/* ============ Atelier 0 : Données ============ */

function newtonInset(svg, f, fun) {
  if (!isFinite(f.xn)) return;
  const iw = 215, ih = 155;
  const ix = 640 - iw - 16, iy = 16;
  const x1 = f.x, x2 = f.xn, root = fun.root;
  let xa = Math.min(x1, x2, root), xb = Math.max(x1, x2, root);
  let xspan = xb - xa;
  if (xspan < 1e-12) xspan = 1e-6;
  xa -= xspan * 0.25; xb += xspan * 0.25;
  const ya0 = Math.min(0, f.fx), yb0 = Math.max(0, f.fx);
  let yspan = yb0 - ya0;
  if (yspan < 1e-12) yspan = Math.max(1e-6, Math.abs(f.fx) * 0.5);
  let ya = ya0 - yspan * 0.25, yb = yb0 + yspan * 0.25;

  const nested = sv('svg', { x: ix, y: iy, width: iw, height: ih });
  nested.append(sv('rect', { x: 0, y: 0, width: iw, height: ih, fill: '#ffffff', stroke: '#2e6da4', 'stroke-width': 1.5, rx: 4 }));

  const ml = 14, mr = 14, mt = 24, mb = 14;
  const plw = iw - ml - mr, plh = ih - mt - mb;
  const toX = x => ml + (x - xa) / (xb - xa) * plw;
  const toY = y => mt + (yb - y) / (yb - ya) * plh;

  if (ya < 0 && yb > 0) nested.append(sv('line', { x1: ml, y1: toY(0), x2: ml + plw, y2: toY(0), stroke: '#5a6068', 'stroke-width': 1 }));

  let d = '', started = false;
  for (let i = 0; i <= 100; i++) {
    const x = xa + (xb - xa) * i / 100;
    let y = fun.f(x);
    if (!isFinite(y)) { started = false; continue; }
    if (y < ya) y = ya;
    if (y > yb) y = yb;
    d += (started ? 'L' : 'M') + toX(x).toFixed(2) + ' ' + toY(y).toFixed(2) + ' ';
    started = true;
  }
  if (d) nested.append(sv('path', { d, fill: 'none', stroke: '#2e6da4', 'stroke-width': 1.6 }));

  if (root >= xa && root <= xb) nested.append(sv('circle', { cx: toX(root), cy: toY(0), r: 3, fill: '#1e7a2e', stroke: '#fff', 'stroke-width': 1.2 }));

  nested.append(sv('line', { x1: toX(x1), y1: toY(f.fx), x2: toX(x2), y2: toY(0), stroke: '#7b4fc2', 'stroke-width': 1.8 }));

  nested.append(sv('circle', { cx: toX(x1), cy: toY(f.fx), r: 3.5, fill: '#c0281f', stroke: '#fff', 'stroke-width': 1.2 }));
  nested.append(sv('circle', { cx: toX(x2), cy: toY(0), r: 3.5, fill: '#9a5b00', stroke: '#fff', 'stroke-width': 1.2 }));

  nested.append(sv('text', { x: iw / 2, y: 15, 'text-anchor': 'middle', 'font-size': 11, fill: '#1b4a76', 'font-weight': 600, 'font-family': 'IBM Plex Sans, sans-serif' }, 'Zoom · étape n = ' + f.n));

  const lx1 = toX(x1), ly1 = toY(f.fx);
  const lx2 = toX(x2), ly2 = toY(0);
  const ax1 = lx1 > iw / 2 ? 'end' : 'start';
  const dx1 = lx1 > iw / 2 ? -5 : 5;
  const ax2 = lx2 > iw / 2 ? 'end' : 'start';
  const dx2 = lx2 > iw / 2 ? -5 : 5;
  nested.append(sv('text', { x: lx1 + dx1, y: ly1 - 5, 'text-anchor': ax1, 'font-size': 10, fill: '#c0281f', 'font-family': 'IBM Plex Mono, monospace', 'font-weight': 700 }, 'x' + f.n));
  nested.append(sv('text', { x: lx2 + dx2, y: ly2 + 12, 'text-anchor': ax2, 'font-size': 10, fill: '#9a5b00', 'font-family': 'IBM Plex Mono, monospace', 'font-weight': 700 }, 'x' + (f.n + 1)));

  svg.append(nested);
}

function gaussFrames(A, B) {
  const n = A.length, M = A.map((row, i) => [...row, B[i]]), F = [];

  for (let k = 0; k < n; k++) {
    let p = k;
    for (let i = k + 1; i < n; i++) if (Math.abs(M[i][k]) > Math.abs(M[p][k])) p = i;
    if (p !== k) { [M[p], M[k]] = [M[k], M[p]]; F.push({ M: M.map(r => [...r]), pivot: k, row: p, mult: null, phase: 'swap' }); }
    for (let i = k + 1; i < n; i++) {
      const m = M[i][k] / M[k][k];
      for (let j = k; j <= n; j++) M[i][j] -= m * M[k][j];
      F.push({ M: M.map(r => [...r]), pivot: k, row: i, mult: m, phase: 'elim' });
    }
  }
  const X = new Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) { let s = M[i][n]; for (let j = i + 1; j < n; j++) s -= M[i][j] * X[j]; X[i] = s / M[i][i]; }
  F.push({ M: M.map(r => [...r]), pivot: -1, row: -1, phase: 'solve', X: X.slice() });
  return F;
}

const CODE_F5 = 'import numpy as np\n\n# --- Moindres carrés explicites ---\ndef reg_lin(X, Y):\n    n = len(X)\n    a = (n * np.sum(X*Y) - np.sum(X)*np.sum(Y)) / \\\n        (n * np.sum(X**2) - np.sum(X)**2)\n    b = (np.sum(Y) - a * np.sum(X)) / n\n    return a, b\n\n# --- Descente de gradient ---\ndef descente(X, Y, alpha=0.1, niter=1000):\n    a, b = 0.0, 0.0\n    n = len(X)\n    for _ in range(niter):\n        r = a*X + b - Y\n        a -= alpha * 2 * np.sum(X * r) / n\n        b -= alpha * 2 * np.sum(r) / n\n    return a, b\n\n# --- Ajustement polynomial (numpy) ---\ncoeffs = np.polyfit(X, Y, deg=2)   # [a2, a1, a0]\ny_mod = np.polyval(coeffs, X)';

function drawCost3D(box, pts, aCur, bCur, trail) {
  const Q = (a, b) => pts.reduce((s, p) => s + Math.pow(p.y - a * p.x - b, 2), 0);
  const opt = linreg(pts);
  const aOpt = opt.a, bOpt = opt.b;
  const Qmin = Q(aOpt, bOpt);
  const aSpan = 4, bSpan = 2;
  const aR = [aOpt - aSpan, aOpt + aSpan];
  const bR = [bOpt - bSpan, bOpt + bSpan];
  const W = 640, H = 420;
  const svg = sv('svg', {viewBox: `0 0 ${W} ${H}`, class: 'plot'});
  svg.style.width = '100%'; svg.style.height = 'auto'; svg.style.display = 'block';
  svg.append(sv('rect', {x: 0, y: 0, width: W, height: H, fill: '#ffffff'}));
  const cx = W / 2, cy = H / 2 + 30;
  const ang = Math.PI / 6, cs = Math.cos(ang), sn = Math.sin(ang);
  const NA = 14, NB = 12;
  const gridQ = [];
  let Qmax = Qmin;
  for (let i = 0; i <= NA; i++) {
    gridQ.push([]);
    const a = aR[0] + (aR[1] - aR[0]) * i / NA;
    for (let j = 0; j <= NB; j++) {
      const b = bR[0] + (bR[1] - bR[0]) * j / NB;
      const q = Q(a, b);
      gridQ[i].push(q);
      if (q > Qmax) Qmax = q;
    }
  }
  const Qcap = Qmin + (Qmax - Qmin) * 0.35;
  const scA = W * 0.30 / aSpan;
  const scB = W * 0.30 / bSpan;
  const scQ = H * 0.55 / (Qcap - Qmin);
  function proj(a, b, q) {
    const x = (a - aOpt) * scA, y = (b - bOpt) * scB;
    const z = (Math.min(q, Qcap) - Qmin) * scQ;
    return [cx + (x - y) * cs, cy + (x + y) * sn * 0.55 - z];
  }
  function colorQ(q) {
    const t = Math.min(1, Math.max(0, (q - Qmin) / (Qcap - Qmin)));
    let r, g, bl;
    if (t < 0.5) { const u = t * 2; r = 30 + (240 - 30) * u; g = 150 + (200 - 150) * u; bl = 50; }
    else { const u = (t - 0.5) * 2; r = 240 + (200 - 240) * u; g = 200 + (30 - 200) * u; bl = 50 + (30 - 50) * u; }
    return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(bl)})`;
  }
  const quads = [];
  for (let i = 0; i < NA; i++) {
    for (let j = 0; j < NB; j++) {
      const a0 = aR[0] + (aR[1] - aR[0]) * i / NA;
      const a1 = aR[0] + (aR[1] - aR[0]) * (i + 1) / NA;
      const b0 = bR[0] + (bR[1] - bR[0]) * j / NB;
      const b1 = bR[0] + (bR[1] - bR[0]) * (j + 1) / NB;
      const qAvg = (gridQ[i][j] + gridQ[i + 1][j] + gridQ[i + 1][j + 1] + gridQ[i][j + 1]) / 4;
      quads.push({ a0, a1, b0, b1, q00: gridQ[i][j], q10: gridQ[i + 1][j], q11: gridQ[i + 1][j + 1], q01: gridQ[i][j + 1], qAvg, depth: (a0 + a1) / 2 + (b0 + b1) / 2 });
    }
  }
  quads.sort((p, q) => p.depth - q.depth);
  for (const qd of quads) {
    const p00 = proj(qd.a0, qd.b0, qd.q00);
    const p10 = proj(qd.a1, qd.b0, qd.q10);
    const p11 = proj(qd.a1, qd.b1, qd.q11);
    const p01 = proj(qd.a0, qd.b1, qd.q01);
    const d = `M${p00[0].toFixed(1)},${p00[1].toFixed(1)} L${p10[0].toFixed(1)},${p10[1].toFixed(1)} L${p11[0].toFixed(1)},${p11[1].toFixed(1)} L${p01[0].toFixed(1)},${p01[1].toFixed(1)} Z`;
    svg.append(sv('path', { d, fill: colorQ(qd.qAvg), stroke: 'rgba(255,255,255,0.35)', 'stroke-width': 0.4 }));
  }
  const pOpt = proj(aOpt, bOpt, Qmin);
  svg.append(sv('circle', { cx: pOpt[0], cy: pOpt[1], r: 5, fill: '#1e7a2e', stroke: '#fff', 'stroke-width': 1.5 }));
  svg.append(sv('text', { x: pOpt[0] + 10, y: pOpt[1] + 4, 'font-size': 11, fill: '#1e7a2e', 'font-family': 'IBM Plex Mono, monospace', 'font-weight': 600 }, 'optimum'));
  if (trail && trail.length > 1) {
    let d = '';
    trail.forEach((pt, i) => {
      const p = proj(pt.a, pt.b, Q(pt.a, pt.b));
      d += (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' ';
    });
    svg.append(sv('path', { d, fill: 'none', stroke: '#9a5b00', 'stroke-width': 2, 'stroke-dasharray': '5 3' }));
  }
  const qCur = Q(aCur, bCur);
  const pCur = proj(aCur, bCur, qCur);
  const pBase = proj(aCur, bCur, Qmin);
  svg.append(sv('line', { x1: pCur[0], y1: pCur[1], x2: pBase[0], y2: pBase[1], stroke: '#c0281f', 'stroke-width': 1, 'stroke-dasharray': '3 2' }));
  svg.append(sv('circle', { cx: pCur[0], cy: pCur[1], r: 6, fill: '#c0281f', stroke: '#fff', 'stroke-width': 2 }));
  svg.append(sv('text', { x: 12, y: 20, 'font-size': 12, fill: '#111', 'font-family': 'IBM Plex Sans, sans-serif', 'font-weight': 600 }, 'Coût Q(a,b) = Σ (y_i − a·x_i − b)²'));
  svg.append(sv('text', { x: 12, y: 36, 'font-size': 11, fill: '#5a6068', 'font-family': 'IBM Plex Sans, sans-serif' }, 'Surface 3D du coût — vue isométrique'));
  svg.append(sv('text', { x: 12, y: 52, 'font-size': 11, fill: '#c0281f', 'font-family': 'IBM Plex Mono, monospace' }, `(a, b) = (${aCur.toFixed(2)}, ${bCur.toFixed(2)}) — Q = ${qCur.toFixed(3)}`));
  box.innerHTML = '';
  box.append(svg);
}

function mountF5(root) {
  root.innerHTML = '<h2>Régression linéaire et polynomiale</h2>' +
    '<p>On cherche à ajuster une droite θ<sub>g</sub> = a·λ + b (ou un polynôme) sur un nuage de points expérimentaux. Trois méthodes équivalentes : <b>moindres carrés</b> (résolution analytique), <b>descente de gradient</b> (itérative), <b>polynôme numpy</b> (degré quelconque).</p>' +
    '<div class="fld"><span>Méthode</span><div id="f5-mode"></div></div>' +
    '<div class="opts" id="f5-ctrl"></div>' +
    '<h3>Données et ajustement (2D)</h3>' +
    '<div class="plot-wrap"><div id="f5-plot"></div></div>' +
    '<div id="f5-3dsec"><h3>Surface de coût Q(a, b) en 3D</h3>' +
    '<p class="small">Le coût Q(a,b) = Σ(y<sub>i</sub> − a·x<sub>i</sub> − b)² mesure l\'écart entre les points et la droite. La surface est un « bol » dont le fond est l\'optimum des moindres carrés. Le point rouge est la position courante (a, b) ; le point vert, l\'optimum.</p>' +
    '<div class="plot-wrap"><div id="f5-plot3d"></div></div></div>' +
    '<div id="f5-stats"></div><div id="f5-note"></div>' +
    codeBlock(CODE_F5);
  if (!F5.pts) genPts();
  $('#f5-mode').append(chipsRow([['mc', 'Moindres carrés'], ['grad', 'Descente de gradient'], ['poly', 'Polynôme']], F5.mode, k => { F5.mode = k; drawF5(); }));
  drawF5();
}
function drawF5() {
  const ctrl = $('#f5-ctrl'); ctrl.innerHTML = '';
  let a, b, poly = null, trail = null;
  if (F5.mode === 'mc') {
    const opt = linreg(F5.pts);
    a = F5.a; b = F5.b;
    ctrl.append(h('label', { class: 'fld' }, h('span', { html: 'a = <b>' + fmt(a, 2) + '</b>' }), h('input', { type: 'range', min: 0, max: 8, step: 0.1, value: String(a), oninput: e => { F5.a = +e.target.value; drawF5(); } })));
    ctrl.append(h('label', { class: 'fld' }, h('span', { html: 'b = <b>' + fmt(b, 2) + '</b>' }), h('input', { type: 'range', min: -2, max: 2, step: 0.1, value: String(b), oninput: e => { F5.b = +e.target.value; drawF5(); } })));
    ctrl.append(h('button', { class: 'btn', type: 'button', onclick: () => { F5.a = opt.a; F5.b = opt.b; drawF5(); } }, 'Optimal : a=' + fmt(opt.a, 3) + ', b=' + fmt(opt.b, 3)));
  } else if (F5.mode === 'grad') {
    const R = gradDescent(F5.pts, F5.alpha, F5.niter);
    a = R.a; b = R.b; trail = R.H;
    ctrl.append(h('label', { class: 'fld' }, h('span', { html: 'α = <b>' + fmt(F5.alpha, 2) + '</b>' }), h('input', { type: 'range', min: 0.05, max: 2, step: 0.05, value: String(F5.alpha), oninput: e => { F5.alpha = +e.target.value; drawF5(); } })));
    ctrl.append(h('label', { class: 'fld' }, h('span', { html: 'Itérations = <b>' + F5.niter + '</b>' }), h('input', { type: 'range', min: 0, max: 100, step: 1, value: String(F5.niter), oninput: e => { F5.niter = +e.target.value; drawF5(); } })));
    ctrl.append(h('button', { class: 'btn', type: 'button', onclick: () => { F5.a = 0; F5.b = 0; drawF5(); } }, 'Réinitialiser (0,0)'));
  } else {
    poly = polyfit(F5.pts, F5.deg);
    ctrl.append(h('label', { class: 'fld' }, h('span', { html: 'Degré = <b>' + F5.deg + '</b>' }), h('input', { type: 'range', min: 1, max: 4, step: 1, value: String(F5.deg), oninput: e => { F5.deg = +e.target.value; drawF5(); } })));
    ctrl.append(h('div', { class: 'fld' }, h('span', null, 'Coefficients : '), h('code', null, poly.map(c => fmt(c, 3)).join(', '))));
    a = poly.length > 1 ? poly[poly.length - 2] : 0;
    b = poly[poly.length - 1];
  }
  const pts = F5.pts;
  const xmin = Math.min(...pts.map(p => p.x)), xmax = Math.max(...pts.map(p => p.x));
  const ymin = Math.min(...pts.map(p => p.y)), ymax = Math.max(...pts.map(p => p.y));
  const padY = (ymax - ymin) * 0.15 + 0.05;
  const P = plot(640, 320, [xmin - 0.05, xmax + 0.05], [ymin - padY, ymax + padY]);
  pts.forEach(p => P.point(p.x, p.y, '#2e6da4', 4.5));
  const fadj = poly ? (x => polyval(poly, x)) : (x => a * x + b);
  P.polyline([[xmin, fadj(xmin)], [xmax, fadj(xmax)]], '#c0281f', 2.2);
  $('#f5-plot').innerHTML = ''; $('#f5-plot').append(P.svg);
  const sec = $('#f5-3dsec');
  if (sec) sec.style.display = F5.mode === 'poly' ? 'none' : '';
  if (F5.mode !== 'poly') {
    drawCost3D($('#f5-plot3d'), pts, a, b, trail);
  }
  const opt = linreg(pts);
  const err_adj = rms(pts, fadj);
  $('#f5-stats').innerHTML = '';
  $('#f5-stats').append(stats([
    ['Mode', F5.mode === 'mc' ? 'Moindres carrés' : F5.mode === 'grad' ? 'Gradient' : 'Polynôme'],
    ['a ajusté', fmt(poly ? a : a, 4)],
    ['b ajusté', fmt(b, 4)],
    ['RMS (erreur)', fmt(err_adj, 5)],
    ['a optimal', fmt(opt.a, 4)],
    ['b optimal', fmt(opt.b, 4)]
  ]));
  $('#f5-note').innerHTML = '';
  if (F5.mode === 'mc') {
    $('#f5-note').append(h('div', { class: 'verdict', html: 'Les <b>moindres carrés</b> donnent directement a = ' + fmt(opt.a, 4) + ', b = ' + fmt(opt.b, 4) + ' par formule explicite. Sur la surface 3D, le point vert est l\'optimum (fond du bol), le point rouge est votre réglage manuel.' }));
  } else if (F5.mode === 'grad') {
    const dist = Math.sqrt(Math.pow(a - opt.a, 2) + Math.pow(b - opt.b, 2));
    $('#f5-note').append(h('div', { class: 'verdict', html: 'Après ' + F5.niter + ' itérations, (a, b) est à distance ' + fmt(dist, 4) + ' de l\'optimum. La trace orange sur la surface 3D est le chemin parcouru. Augmentez α (sans dépasser) ou le nombre d\'itérations pour converger plus près.' }));
  } else {
    $('#f5-note').append(h('div', { class: 'verdict', html: 'Ajustement polynomial de degré ' + F5.deg + ' (via <code>np.polyfit</code>). Un degré plus élevé passe plus près des points mais risque de <b>sur-apprendre</b> (oscillations).' }));
  }
}

COURSE.push({ id: 'notions', t: 'Notions générales', h: `
<p>Résoudre <b>numériquement</b> un problème : en calculer une solution approchée par opérations élémentaires. Deux grands types : problèmes <b>directs</b> (intégration, dérivation) et problèmes <b>itératifs</b> (équations, systèmes, EDO).</p>
<h3>Erreur</h3>
<div class="formula">erreur absolue = |x̃ − x| &nbsp;·&nbsp; erreur relative = |x̃ − x| / |x|</div>
<h3>Critère d'arrêt</h3>
<p>Un algorithme itératif s'arrête quand l'une de ces conditions est satisfaite :</p>
<ul>
<li>|x<sub>n+1</sub> − x<sub>n</sub>| &lt; ε (itérés stables) ;</li>
<li>|f(x<sub>n</sub>)| &lt; ε (f presque nulle) ;</li>
<li>|b − a| &lt; ε (intervalle d'encadrement) ;</li>
<li>n atteint N_max (garde-fou).</li>
</ul>
<h3>Ordre de convergence</h3>
<p>|x<sub>n+1</sub> − x| ≤ C·|x<sub>n</sub> − x|<sup>p</sup>. Ordre 1 = linéaire, ordre 2 = quadratique.</p>
<div class="retain"><b>À retenir.</b> ε = critère d'arrêt. Plus ε est petite, plus le résultat est précis, plus le nombre d'itérations est grand.</div>` });

COURSE.push({ id: 'equations', t: 'Équation f(x) = 0', h: `
<h3>Dichotomie</h3>
<p><b>Hypothèse :</b> f continue, f(a)·f(b) &lt; 0.</p>
<pre class="code">def dichotomie(f, a, b, eps):
    while b - a &gt; eps:
        m = (a + b) / 2
        if f(a) * f(m) &lt;= 0: b = m
        else: a = m
    return (a + b) / 2</pre>
<ul><li>Largeur divisée par 2 à chaque pas.</li><li>Environ <b>log₂((b−a)/ε)</b> itérations.</li><li>Convergence <b>linéaire</b>.</li></ul>
<h3>Newton</h3>
<p><b>Hypothèse :</b> f dérivable, f\' ≠ 0 près de la racine, x₀ proche.</p>
<pre class="code">def newton(f, fp, x0, eps, N=50):
    x = x0
    for _ in range(N):
        if abs(f(x)) &lt; eps: return x
        x = x - f(x) / fp(x)
    return x</pre>
<div class="formula">x<sub>n+1</sub> = x<sub>n</sub> − f(x<sub>n</sub>)/f\'(x<sub>n</sub>)</div>
<ul><li>Convergence <b>quadratique</b> (chiffres exacts doublés à chaque pas) si <b>f\'(racine) ≠ 0</b>.</li><li>Convergence <b>linéaire</b> seulement si f\'(racine) = 0 (racine multiple). Ex : (x−1)³.</li><li>Peut diverger si x₀ est mal choisi.</li></ul>
<div class="retain"><b>À retenir.</b> Dichotomie : robuste, lente. Newton : rapide, locale. Sur une racine multiple, Newton devient lent.</div>` });

COURSE.push({ id: 'systemes', t: 'Système A·X = B', h: `
<h3>Pivot de Gauss</h3>
<p>On écrit [A | B] et on effectue des combinaisons de lignes pour rendre A triangulaire supérieure, puis on remonte.</p>
<pre class="code">def gauss(A, B):
    n = len(A)
    M = [row[:] + [B[i]] for i, row in enumerate(A)]
    for k in range(n):
        p = max(range(k, n), key=lambda i: abs(M[i][k]))
        M[k], M[p] = M[p], M[k]
        for i in range(k + 1, n):
            m = M[i][k] / M[k][k]
            for j in range(k, n + 1):
                M[i][j] -= m * M[k][j]
    X = [0] * n
    for i in range(n - 1, -1, -1):
        s = M[i][n]
        for j in range(i + 1, n):
            s -= M[i][j] * X[j]
        X[i] = s / M[i][i]
    return X</pre>
<h3>Pivot partiel</h3>
<p>Choisir le coefficient de plus grande valeur absolue dans la colonne. Évite les divisions par de petits nombres.</p>
<h3>Coût</h3>
<p>≈ 2n³/3 pour la descente, n² pour la remontée.</p>
<div class="retain"><b>À retenir.</b> Gauss = O(n³), pivot partiel indispensable.</div>` });

COURSE.push({ id: 'euler', t: 'Équation différentielle : Euler explicite et implicite', h: `
<p>Problème de Cauchy : y\'(t) = f(t, y(t)), y(t₀) = y₀.</p>
<h3>Euler explicite</h3>
<div class="formula">y<sub>n+1</sub> = y<sub>n</sub> + h · f(t<sub>n</sub>, y<sub>n</sub>)</div>
<pre class="code">def euler_explicite(f, t0, y0, T, h):
    n = int(round((T - t0) / h))
    t, y = t0, y0
    T_l, Y_l = [t], [y]
    for _ in range(n):
        y = y + h * f(t, y)
        t = t + h
        T_l.append(t); Y_l.append(y)
    return T_l, Y_l</pre>
<ul><li>Direct, 1 évaluation de f par pas.</li><li>Ordre global 1 (erreur ∝ h).</li><li>Instable si h trop grand sur équations raides.</li></ul>
<h3>Euler implicite</h3>
<div class="formula">y<sub>n+1</sub> = y<sub>n</sub> + h · f(t<sub>n+1</sub>, y<sub>n+1</sub>)</div>
<p>Il faut <b>résoudre une équation</b> à chaque pas (souvent par Newton). Pour y\' = a·y + b :</p>
<div class="formula">y<sub>n+1</sub> = (y<sub>n</sub> + h·b) / (1 − h·a)</div>
<pre class="code">def euler_implicite(f, t0, y0, T, h, implicite):
    n = int(round((T - t0) / h))
    t, y = t0, y0
    T_l, Y_l = [t], [y]
    for _ in range(n):
        y = implicite(t, y, h)   # résout y = y_n + h*f(t+h, y)
        t = t + h
        T_l.append(t); Y_l.append(y)
    return T_l, Y_l</pre>
<ul><li>Ordre global 1 aussi.</li><li><b>Plus stable</b> : sur y\' = −λy (λ>0), facteur 1/(1+λh) ∈ ]0,1[, toujours stable, même pour h très grand.</li><li>Plus coûteux (résolution d\'équation).</li></ul>
<div class="retain"><b>À retenir.</b> Explicite : simple, rapide, conditionnellement stable. Implicite : coûteux, inconditionnellement stable. Tous deux d\'ordre 1.</div>` });

COURSE.push({ id: 'integration', t: 'Intégration et dérivation numériques', h: `
<h3>Intégration</h3>
<table class="ctable"><thead><tr><th>Méthode</th><th>Formule</th><th>Ordre</th></tr></thead><tbody>
<tr><td>Rectangles (G/D)</td><td>h · f(x<sub>i</sub>)</td><td>O(h)</td></tr>
<tr><td>Point milieu</td><td>h · f((x<sub>i</sub>+x<sub>i+1</sub>)/2)</td><td>O(h²)</td></tr>
<tr><td>Trapèzes</td><td>h/2 · (f(x<sub>i</sub>) + f(x<sub>i+1</sub>))</td><td>O(h²)</td></tr>
</tbody></table>
<pre class="code">def trapezes(f, a, b, n):
    h = (b - a) / n
    s = 0
    for i in range(n):
        s += (f(a + i*h) + f(a + (i+1)*h)) / 2 * h
    return s</pre>
<h3>Dérivation</h3>
<table class="ctable"><thead><tr><th>Schéma</th><th>Formule</th><th>Ordre</th></tr></thead><tbody>
<tr><td>Avant</td><td>(f(x+h) − f(x))/h</td><td>O(h)</td></tr>
<tr><td>Arrière</td><td>(f(x) − f(x−h))/h</td><td>O(h)</td></tr>
<tr><td>Centré</td><td>(f(x+h) − f(x−h))/(2h)</td><td>O(h²)</td></tr>
</tbody></table>
<div class="retain"><b>À retenir.</b> Trapèzes et point milieu en O(h²) ; rectangles en O(h). Dérivation : centrée O(h²).</div>` });

COURSE.push({ id: 'regression', t: 'Régression linéaire et polynomiale', h: `
<p>On cherche les paramètres (a, b) d'un modèle linéaire y = a·x + b qui minimisent l'écart aux mesures (x<sub>k</sub>, y<sub>k</sub>).</p>
<h3>Coût Q(a,b)</h3>
<div class="formula">Q(a, b) = Σ<sub>k=1</sub><sup>n</sup> (y<sub>k</sub> − a·x<sub>k</sub> − b)²</div>
<p>Q est une fonction quadratique de (a, b) : c'est un <b>paraboloïde</b> (un bol) dont le fond est l'optimum. L'atelier 6 en donne une vue 3D.</p>
<h3>Moindres carrés</h3>
<p>On annule les dérivées partielles ∂Q/∂a et ∂Q/∂b. On obtient :</p>
<div class="formula">a = (n·Σx<sub>k</sub>y<sub>k</sub> − Σx<sub>k</sub>·Σy<sub>k</sub>) / (n·Σx<sub>k</sub>² − (Σx<sub>k</sub>)²)</div>
<div class="formula">b = (Σy<sub>k</sub> − a·Σx<sub>k</sub>) / n</div>
<pre class="code">def reg_lin(X, Y):
    n = len(X)
    a = (n * np.sum(X*Y) - np.sum(X)*np.sum(Y)) / \\
        (n * np.sum(X**2) - np.sum(X)**2)
    b = (np.sum(Y) - a * np.sum(X)) / n
    return a, b</pre>
<p>C'est la solution la plus rapide (formule explicite), utilisée pour l'attelle de genou : θ<sub>g</sub> = a·λ + b.</p>
<h3>Descente de gradient</h3>
<p>Méthode <b>itérative</b> qui ne nécessite pas de formule fermée. On part de (a₀, b₀) et on itère :</p>
<div class="formula">a<sup>(k+1)</sup> = a<sup>(k)</sup> − α · (2/n) · Σ x<sub>i</sub>(a<sup>(k)</sup>x<sub>i</sub> + b<sup>(k)</sup> − y<sub>i</sub>)</div>
<div class="formula">b<sup>(k+1)</sup> = b<sup>(k)</sup> − α · (2/n) · Σ (a<sup>(k)</sup>x<sub>i</sub> + b<sup>(k)</sup> − y<sub>i</sub>)</div>
<pre class="code">def descente(X, Y, alpha=0.1, niter=1000):
    a, b = 0.0, 0.0
    n = len(X)
    for _ in range(niter):
        r = a*X + b - Y
        a -= alpha * 2 * np.sum(X * r) / n
        b -= alpha * 2 * np.sum(r) / n
    return a, b</pre>
<ul>
<li><b>α</b> est le <b>taux d'apprentissage</b> : trop petit → convergence lente ; trop grand → divergence ou oscillations.</li>
<li>La trace sur la surface 3D est le chemin parcouru dans le plan (a, b).</li>
<li>Se généralise à des modèles non linéaires (réseaux de neurones).</li>
</ul>
<h3>Ajustement polynomial (numpy)</h3>
<pre class="code">coeffs = np.polyfit(X, Y, deg=2)   # [a2, a1, a0]
y_mod = np.polyval(coeffs, X)</pre>
<p>Attention au <b>sur-apprentissage</b> : un degré trop élevé passe par tous les points mais oscille entre.</p>
<div class="retain"><b>À retenir.</b> Moindres carrés = formule explicite rapide. Descente de gradient = itérative, généralisable. Toujours vérifier le RMS et le bon sens physique.</div>` });

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Méthode numérique</dt><dd>Algorithme qui calcule une solution approchée.</dd>
<dt>Tolérance ε</dt><dd>Seuil d'arrêt d'un algorithme itératif.</dd>

</dl>` });

  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + '/' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  art.append(h('div', { class: 'cpn' }, idx > 0 ? h('button', { class: 'btn', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'), idx < COURSE.length - 1 ? h('button', { class: 'btn pri', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  box.append(h('div', { class: 'ctop' }, h('b', null, 'Cours'), h('button', { class: 'btn pri sm', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour')), sel, h('div', { class: 'cwrap' }, nav, art));
  box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });
function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
$('#bHelp').addEventListener('click', () => {
  $('#dlg').hidden = false;
  $('#dlg').innerHTML = '<div class="dlgbox"><header><b>Aide</b><button class="btn sm" onclick="closeDlg()">Fermer</button></header><div class="dbody"><p>6 ateliers : données (listes vs numpy), f(x)=0, système A·X=B, Euler, intégration/dérivation, régression.</p><p><b>Nouveautés :</b></p><ul><li>F1 : fonction f(x) = (x−1)³ pour observer une convergence lente de Newton (racine triple).</li><li>F3 : Euler explicite <b>et</b> implicite superposés, avec comparaison des erreurs.</li><li>F5 : surface 3D du coût Q(a, b) en vue isométrique.</li><li>« Vectorisé » : explication ajoutée dans l\'atelier 1 et le cours.</li></ul></div></div>';
  $('#dlg').onclick = e => { if (e.target.id === 'dlg') closeDlg(); };
});
(function init() { AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); })();
</script>
