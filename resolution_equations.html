<!doctype html>

<title>Atelier Méthodes numériques — SII CPGE 1re année</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;

  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
:is(button,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
#stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}

.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none}
.phead b{font-size:15px}
.phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:12px;flex:1;min-height:0}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}
input[type=range]{width:100%;padding:0;accent-color:var(--accent)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.small{font-size:12px;color:var(--muted);margin:0 0 9px}

#dlg{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlgbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:88%;display:flex;flex-direction:column}
.dlgbox header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgbox header b{font-size:16px}
.dlgbox .dbody{padding:14px 16px;overflow:auto}
.dlgbox h3{margin:14px 0 4px;font-size:14px}.dlgbox p,.dlgbox li{margin:4px 0;font-size:13.5px}
#act{flex:none;width:clamp(280px,24vw,340px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;max-height:100%}
#act .pbody{font-size:13.5px}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:9px}
.defi{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 12px}.defi p{margin:6px 0}
.defi summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
fieldset.q{border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;margin:0 0 10px;min-width:0}
fieldset.q legend{font-weight:600;padding:0 4px;max-width:100%}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer}
.opt input{margin-top:3px;width:auto;flex:none}
.opt.good{background:rgba(30,122,46,.15)}.opt.bad{background:rgba(192,40,31,.15)}
.why{font-size:12.5px;color:var(--muted);margin:6px 4px 2px}
.score{font-weight:600;font-size:15px;margin:4px 0 8px}
#course{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.ctop,.cwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bar)}
.cwrap{flex:1;min-height:0;display:flex;gap:28px;padding-block:14px}
.ctoc{flex:none;width:250px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ctoc button{display:block;width:100%;text-align:left;padding:6px 10px;border:0;border-left:3px solid transparent;background:transparent;cursor:pointer;font-size:13.5px}
.ctoc button:hover{background:var(--panel2)}
.ctoc button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ctoc-sel{display:none;margin:8px max(16px,env(safe-area-inset-left,0px)) 0;width:auto}
.cbody{flex:1;min-width:0;overflow:auto;max-width:860px;padding-right:6px}
.ckick{color:var(--muted);font-size:12.5px;margin:0}
.cbody h2{font-size:26px;margin:2px 0 12px;text-wrap:balance}
.cbody h3{font-size:16.5px;margin:22px 0 6px}
.cbody p,.cbody li{font-size:14.5px;line-height:1.6}
.cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
.cbody table{display:block;overflow-x:auto;max-width:100%}
.ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
.ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
.formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:15px;overflow-x:auto}

.gloss{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;font-size:14px}.gloss dt{font-weight:600}.gloss dd{margin:0}
.cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}
#ws{padding:16px max(16px,env(safe-area-inset-left,0px)) 30px;max-width:980px}
#ws h2{font-size:24px;margin:0 0 8px;text-wrap:balance}
#ws h3{font-size:16.5px;margin:24px 0 6px}
#ws p,#ws li{font-size:14.5px;line-height:1.55}
#ws .small{font-size:12.5px}
.opts{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 10px}.opts .fld{margin:0}
.opts input[type=range]{width:200px;max-width:100%}
.opts select{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}.stat b{font-size:14px;font-family:var(--font-mono);overflow-wrap:anywhere}
.verdict{border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.verdict.yes{background:rgba(30,122,46,.15);border-color:var(--ok)}.verdict.no{background:rgba(192,40,31,.13);border-color:var(--bad)}.verdict.warn{background:rgba(154,91,0,.13);border-color:var(--warn)}
.dwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:8px 0}
.dt{border-collapse:collapse;width:100%;font-size:13.5px}
.dt th,.dt td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.dt thead th{background:var(--panel2);font-weight:600}
.dt td.m{font-family:var(--font-mono);font-size:12.5px}
.dt tr:last-child td{border-bottom:0}
.plot{width:100%;height:auto;display:block;background:#fff;border-radius:8px}
.plot-wrap{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;margin:8px 0}
.plot-legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 2px}
.plot-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.mtx{border-collapse:collapse;font-family:var(--font-mono);font-size:13px;border-left:2px solid var(--fg);border-right:2px solid var(--fg);margin:0 auto}
.mtx td{padding:4px 11px;text-align:right;transition:background .15s}
.mtx td.piv{background:rgba(46,109,164,0.18);font-weight:600;color:var(--accent-ink)}
.mtx td.mod{background:rgba(154,91,0,0.14)}
.mtx td.sep{border-left:1px solid var(--fg)}
.mtx-wrap{display:flex;justify-content:center;margin:10px 0}
.mtx-cap{font-size:12px;color:var(--muted);text-align:center;margin:2px 0 8px}
@media (max-width:820px){
  .ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}
  #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}
  .work{flex-direction:column;gap:8px}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}.mtx td{transition:background .15s}}

<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {

const WORKSHOPS = [];

/* ---------- utilitaires numériques ---------- */
const fmt = (v, d) => isFinite(v) ? (+v).toFixed(d == null ? 4 : d).replace('.', ',') : '—';

function niceStep(range, target) {
  const raw = range / target;
  const exp = Math.floor(Math.log10(raw));
  const base = Math.pow(10, exp);
  const m = raw / base;
  if (m < 1.5) return base;
  if (m < 3.5) return 2 * base;
  if (m < 7.5) return 5 * base;
  return 10 * base;

function plot(W, H, xr, yr) {
  const ml = 50, mr = 16, mt = 14, mb = 32;
  const iw = W - ml - mr, ih = H - mt - mb;
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, class: 'plot' });
  svg.style.width = '100%'; svg.style.height = 'auto'; svg.style.display = 'block';
  const toX = x => ml + (x - xr[0]) / (xr[1] - xr[0]) * iw;
  const toY = y => mt + (yr[1] - y) / (yr[1] - yr[0]) * ih;
  const g0 = sv('g'); svg.append(g0);
  const xs = niceStep(xr[1] - xr[0], 6), ys = niceStep(yr[1] - yr[0], 5);
  for (let x = Math.ceil(xr[0] / xs) * xs; x <= xr[1] + 1e-9; x += xs)
    g0.append(sv('line', { x1: toX(x), y1: mt, x2: toX(x), y2: mt + ih, stroke: '#e8ebef', 'stroke-width': 1 }));
  for (let y = Math.ceil(yr[0] / ys) * ys; y <= yr[1] + 1e-9; y += ys)
    g0.append(sv('line', { x1: ml, y1: toY(y), x2: ml + iw, y2: toY(y), stroke: '#e8ebef', 'stroke-width': 1 }));

  if (yr[0] <= 0 && yr[1] >= 0) g0.append(sv('line', { x1: ml, y1: toY(0), x2: ml + iw, y2: toY(0), stroke: '#5a6068', 'stroke-width': 1 }));
  for (let x = Math.ceil(xr[0] / xs) * xs; x <= xr[1] + 1e-9; x += xs) {
    if (Math.abs(x) < xs * 0.01) continue;
    g0.append(sv('text', { x: toX(x), y: mt + ih + 15, 'text-anchor': 'middle', 'font-size': 11, fill: '#5a6068', 'font-family': 'IBM Plex Mono, monospace' }, String(+x.toFixed(2)).replace('.', ',')));
  }
  for (let y = Math.ceil(yr[0] / ys) * ys; y <= yr[1] + 1e-9; y += ys) {
    if (Math.abs(y) < ys * 0.01) continue;
    g0.append(sv('text', { x: ml - 5, y: toY(y) + 4, 'text-anchor': 'end', 'font-size': 11, fill: '#5a6068', 'font-family': 'IBM Plex Mono, monospace' }, String(+y.toFixed(2)).replace('.', ',')));
  }
  g0.append(sv('text', { x: ml + iw, y: mt + ih + 28, 'text-anchor': 'end', 'font-size': 11, fill: '#5a6068' }, 'x'));
  g0.append(sv('text', { x: ml - 30, y: mt + 10, 'font-size': 11, fill: '#5a6068' }, 'y'));
  const pg = sv('g'); svg.append(pg);
  const P = {
    svg, toX, toY, g: pg, mt, mb, ml, mr, iw, ih, xr, yr,
    clear() { while (pg.firstChild) pg.removeChild(pg.firstChild); },
    band(x1, x2, color) {
      let px1 = Math.max(ml, Math.min(ml + iw, toX(x1)));
      let px2 = Math.max(ml, Math.min(ml + iw, toX(x2)));
      if (px2 < px1) [px1, px2] = [px2, px1];
      if (px2 - px1 < 0.5) return;
      pg.append(sv('rect', { x: px1, y: mt, width: px2 - px1, height: ih, fill: color || 'rgba(46,109,164,0.13)' }));
    },
    curve(f, color, width) {
      let d = '', started = false;
      const N = 240;
      for (let i = 0; i <= N; i++) {
        const x = xr[0] + (xr[1] - xr[0]) * i / N;

      }
      pg.append(sv('path', { d, fill: 'none', stroke: color || '#2e6da4', 'stroke-width': width || 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    },
    polyline(pts, color, width, dash) {
      const d = pts.map((p, i) => (i ? 'L' : 'M') + toX(p[0]).toFixed(2) + ' ' + toY(p[1]).toFixed(2)).join(' ');

function eulerSolve() {
  const o = ODES[F3.ode];

  const h = o.T / n;

  for (let i = 0; i < n; i++) { y = y + h * o.f(t, y); t = t + h; T.push(t); Y.push(y); }

const INTS = {

  'exp': { label: 'f(x) = eˣ sur [0, 1]', f: x => Math.exp(x), a: 0, b: 1, exact: Math.E - 1, fp: x => Math.exp(x), dfx: 0.5 }
};
const F4 = { tab: 'int', fn: 'x2', n: 4, method: 'trap', h: 0.5 };
function integrate(f, a, b, n, method) {
  const h = (b - a) / n, rects = []; let s = 0;
  for (let i = 0; i < n; i++) {
    const x0 = a + i * h, x1 = a + (i + 1) * h, xm = (x0 + x1) / 2;
    let v;
    if (method === 'left') { v = f(x0) * h; rects.push({ x0, x1, y0: 0, y1: f(x0), kind: 'rect' }); }
    else if (method === 'right') { v = f(x1) * h; rects.push({ x0, x1, y0: 0, y1: f(x1), kind: 'rect' }); }
    else if (method === 'mid') { v = f(xm) * h; rects.push({ x0, x1, y0: 0, y1: f(xm), kind: 'rect' }); }
    else { v = (f(x0) + f(x1)) / 2 * h; rects.push({ x0, x1, y0: f(x0), y1: f(x1), kind: 'trap' }); }
    s += v;
  }
  return { s, rects, h };
}
const CODE_F4 = 'def trapezes(f, a, b, n):\n    """Intégrale de f sur [a, b] par la méthode des trapèzes."""\n    h = (b - a) / n\n    s = 0\n    for i in range(n):\n        x0, x1 = a + i*h, a + (i+1)*h\n        s += (f(x0) + f(x1)) / 2 * h\n    return s\n\n\ndef rectangles_gauche(f, a, b, n):\n    h = (b - a) / n\n    return sum(f(a + i*h) for i in range(n)) * h\n\n\ndef derivee_avant(f, x, h):\n    return (f(x + h) - f(x)) / h\n\n\ndef derivee_arriere(f, x, h):\n    return (f(x) - f(x - h)) / h\n\n\ndef derivee_centree(f, x, h):\n    return (f(x + h) - f(x - h)) / (2 * h)';

const COURSE = [];
COURSE.push({ id: 'notions', t: 'Notions générales', h: `
<p>Résoudre <b>numériquement</b> un problème, c\'est en calculer une solution approchée à l\'aide d\'opérations élémentaires. On distingue les problèmes <b>directs</b> (intégration, dérivation) et les problèmes qui demandent une <b>itération</b> (équations, systèmes, équations différentielles).</p>
<h3>Erreur</h3>
<p>Soit x la valeur exacte et x̃ la valeur approchée. On définit :</p>
<div class="formula">erreur absolue = |x̃ − x| &nbsp;&nbsp;·&nbsp;&nbsp; erreur relative = |x̃ − x| / |x| (si x ≠ 0)</div>
<p>En pratique on ne connaît pas x : on majore l\'erreur par une quantité calculable (largeur d\'un intervalle, écart entre deux itérés, estimation théorique). C\'est exactement le rôle de la <b>tolérance ε</b> : on choisit un seuil que l\'on sait atteindre sans connaître la solution exacte.</p>
<h3>Critère d\'arrêt</h3>
<p>Un algorithme itératif s\'arrête quand l\'une des conditions suivantes est réalisée :</p>
<ul>
<li>|x_{n+1} − x_n| &lt; ε : les itérés ne bougent plus (indicateur de convergence) ;</li>
<li>|f(x_n)| &lt; ε : la valeur de f est presque nulle ;</li>
<li>|b − a| &lt; ε : l\'intervalle d\'encadrement est plus petit que ε (dichotomie) ;</li>
<li>n atteint N_max : garde-fou pour éviter une boucle infinie.</li>
</ul>
<h3>Convergence et ordre</h3>
<p>Une suite (x_n) converge vers x avec un ordre p s\'il existe C &gt; 0 telle que |x_{n+1} − x| ≤ C·|x_n − x|^p pour n assez grand.</p>
<ul>
<li><b>Ordre 1</b> (linéaire) : le nombre de chiffres exacts augmente d\'un nombre constant à chaque pas. Exemple : dichotomie, méthode d\'Euler.</li>
<li><b>Ordre 2</b> (quadratique) : le nombre de chiffres exacts double à chaque pas. Exemple : méthode de Newton.</li>
<li><b>Ordre supérieur</b> : schémas de Runge-Kutta, Simpson.</li>
</ul>
<div class="retain"><b>À retenir.</b> La tolérance ε est le critère d\'arrêt pratique d\'un algorithme itératif : plus ε est petite, plus le résultat est précis, mais plus le nombre d\'itérations est grand.</div>` });

COURSE.push({ id: 'equations', t: 'Équation f(x) = 0', h: `
<p>On cherche x tel que f(x) = 0. Deux méthodes classiques s\'appliquent sous des hypothèses différentes.</p>
<h3>Dichotomie</h3>
<p><b>Hypothèse :</b> f continue sur [a, b] et f(a)·f(b) &lt; 0.</p>
<pre class="code">def dichotomie(f, a, b, eps):
    while b - a &gt; eps:
        m = (a + b) / 2
        if f(a) * f(m) &lt;= 0:
            b = m
        else:
            a = m
    return (a + b) / 2</pre>
<ul>
<li>La largeur de l\'intervalle est divisée par 2 à chaque itération : après n pas, w_n = (b − a)/2^n.</li>
<li>Il faut donc environ <b>log₂((b − a)/ε)</b> itérations pour une précision ε. C\'est très lent mais infaillible.</li>
<li>Critère d\'arrêt typique : <b>b − a &lt; ε</b>.</li>
<li>Convergence <b>linéaire</b> (ordre 1).</li>
</ul>
<h3>Méthode de Newton</h3>
<p><b>Hypothèse :</b> f dérivable et f\' ne s\'annule pas au voisinage de la racine, x₀ « assez proche ».</p>
<pre class="code">def newton(f, fp, x0, eps, N=50):
    x = x0
    for _ in range(N):
        if abs(f(x)) &lt; eps:
            return x
        x = x - f(x) / fp(x)
    return x</pre>
<p>Interprétation géométrique : on remplace la courbe par sa tangente au point (x_n, f(x_n)), et on prend l\'abscisse de l\'intersection de cette tangente avec l\'axe des abscisses.</p>
<div class="formula">x_{n+1} = x_n − f(x_n)/f\'(x_n)</div>
<ul>
<li>Convergence <b>quadratique</b> quand on part près de la racine : les chiffres exacts doublent à chaque itération.</li>
<li>Critères d\'arrêt typiques : <b>|f(x_n)| &lt; ε</b> ou <b>|x_{n+1} − x_n| &lt; ε</b>.</li>
<li>Très rapide, mais fragile : si f\'(x_n) ≈ 0 ou si x₀ est mal choisi, la méthode peut diverger ou osciller.</li>
</ul>
<div class="retain"><b>À retenir.</b> Dichotomie : robuste mais lente (log₂). Newton : rapide (quadratique) mais locale — il faut un bon point de départ et f\'. La tolérance ε règle la précision et le coût.</div>` });

COURSE.push({ id: 'systemes', t: 'Système linéaire A·X = B', h: `
<p>On cherche un vecteur X tel que A·X = B, où A est une matrice n×n et B un vecteur colonne. Si A est inversible, la solution est unique.</p>
<h3>Méthode du pivot de Gauss</h3>
<p>On écrit la <b>matrice augmentée</b> [A | B] et on effectue des combinaisons de lignes pour la rendre triangulaire supérieure, puis on remonte par substitution.</p>
<pre class="code">def gauss(A, B):
    n = len(A)
    M = [row[:] + [B[i]] for i, row in enumerate(A)]
    for k in range(n):
        p = max(range(k, n), key=lambda i: abs(M[i][k]))
        M[k], M[p] = M[p], M[k]
        for i in range(k + 1, n):
            m = M[i][k] / M[k][k]
            for j in range(k, n + 1):
                M[i][j] -= m * M[k][j]
    X = [0] * n
    for i in range(n - 1, -1, -1):
        s = M[i][n]
        for j in range(i + 1, n):
            s -= M[i][j] * X[j]
        X[i] = s / M[i][i]
    return X</pre>
<h3>Pivot partiel</h3>
<p>À l\'étape k, on choisit la ligne i dont le coefficient |a_ik| est maximal, et on l\'échange avec la ligne k. Cela évite de diviser par un nombre très petit, ce qui amplifierait les erreurs d\'arrondi.</p>
<h3>Coût</h3>
<p>La descente coûte de l\'ordre de <b>2n³/3</b> opérations, la remontée n².</p>
<h3>Cas pathologiques</h3>
<ul>
<li>Si A est <b>singulière</b> (déterminant nul), la méthode échoue (division par zéro).</li>
<li>Si A est presque singulière, la solution est très sensible aux erreurs : on parle de <b>mauvais conditionnement</b>.</li>
</ul>
<div class="retain"><b>À retenir.</b> Gauss : O(n³), pivot partiel indispensable, remontée en O(n²). En Python, <code>numpy.linalg.solve</code> fait cela pour vous.</div>` });

COURSE.push({ id: 'euler', t: 'Équations différentielles : Euler', h: `
<p>Un problème de Cauchy s\'écrit : trouver y(t) telle que</p>
<div class="formula">y\'(t) = f(t, y(t)), &nbsp; y(t₀) = y₀</div>
<p>Le schéma d\'<b>Euler explicite</b> discrétise le temps en pas h et calcule y<sub>n+1</sub> à partir de y<sub>n</sub> :</p>
<div class="formula">y_{n+1} = y_n + h · f(t_n, y_n), &nbsp; t_n = t₀ + n·h</div>
<pre class="code">def euler(f, t0, y0, T, h):
    n = int(round((T - t0) / h))
    t, y = t0, y0
    T_list, Y_list = [t], [y]
    for _ in range(n):
        y = y + h * f(t, y)
        t = t + h
        T_list.append(t); Y_list.append(y)
    return T_list, Y_list</pre>
<h3>Interprétation</h3>
<p>Sur chaque intervalle [t_n, t_{n+1}], on remplace la courbe solution par sa tangente au point (t_n, y_n).</p>
<h3>Ordre et erreur</h3>
<ul>
<li>Erreur de troncature <b>locale</b> : O(h²).</li>
<li>Erreur <b>globale</b> sur [t₀, T] : O(h) — la méthode est d\'ordre 1.</li>
<li>Doubler le nombre de pas divise l\'erreur par 2 environ.</li>
</ul>
<h3>Limites</h3>
<ul>
<li><b>Stabilité :</b> pour une équation raide (y\' = −100y par exemple), un h trop grand rend la suite instable.</li>
<li><b>Précision :</b> pour une grande précision, il faut un h très petit, ce qui coûte cher.</li>
<li>On préfère en pratique des méthodes d\'ordre supérieur (Runge-Kutta 4, ordre 4).</li>
</ul>
<div class="retain"><b>À retenir.</b> Euler explicite : une ligne de code, ordre 1, instable si h trop grand. C\'est le point de départ pour comprendre les schémas numériques.</div>` });

COURSE.push({ id: 'integration', t: 'Intégration et dérivation numériques', h: `
<h3>Intégration</h3>
<p>On approche ∫ₐᵇ f(x) dx en découpant [a, b] en n sous-intervalles de largeur h = (b − a)/n et en approchant f sur chaque morceau.</p>
<table class="ctable"><thead><tr><th>Méthode</th><th>Formule sur [x_i, x_{i+1}]</th><th>Erreur globale</th></tr></thead><tbody>
<tr><td>Rectangle à gauche</td><td>h · f(x_i)</td><td>O(h)</td></tr>
<tr><td>Rectangle à droite</td><td>h · f(x_{i+1})</td><td>O(h)</td></tr>
<tr><td>Point milieu</td><td>h · f((x_i + x_{i+1})/2)</td><td>O(h²)</td></tr>
<tr><td>Trapèzes</td><td>h/2 · (f(x_i) + f(x_{i+1}))</td><td>O(h²)</td></tr>
</tbody></table>
<pre class="code">def trapezes(f, a, b, n):
    h = (b - a) / n
    s = 0
    for i in range(n):
        s += (f(a + i*h) + f(a + (i+1)*h)) / 2 * h
    return s</pre>
<h3>Dérivation numérique</h3>
<table class="ctable"><thead><tr><th>Schéma</th><th>Formule</th><th>Erreur</th></tr></thead><tbody>
<tr><td>Avant</td><td>(f(x + h) − f(x)) / h</td><td>O(h)</td></tr>
<tr><td>Arrière</td><td>(f(x) − f(x − h)) / h</td><td>O(h)</td></tr>
<tr><td>Centré</td><td>(f(x + h) − f(x − h)) / (2h)</td><td>O(h²)</td></tr>
</tbody></table>
<p>Attention : si h est trop petit, les erreurs d\'arrondi dominent et l\'erreur augmente. Il existe un <b>h optimal</b> (souvent autour de 10⁻⁸ en double précision).</p>
<div class="retain"><b>À retenir.</b> Intégration : trapèzes et point milieu en O(h²), rectangles en O(h). Dérivation : centré O(h²), avant/arrière O(h).</div>` });

COURSE.push({ id: 'bilan', t: 'Bilan comparatif', h: `
<table class="ctable"><thead><tr><th>Problème</th><th>Méthode</th><th>Ordre / coût</th><th>Critère d\'arrêt</th><th>Hypothèses</th></tr></thead><tbody>
<tr><td rowspan="2">f(x) = 0</td><td>Dichotomie</td><td>Ordre 1, ≈ log₂((b−a)/ε) itérations</td><td>b − a &lt; ε</td><td>f continue, f(a)·f(b) &lt; 0</td></tr>
<tr><td>Newton</td><td>Ordre 2, 1 éval. de f et f\' par pas</td><td>|f(x)| &lt; ε ou |Δx| &lt; ε</td><td>f dérivable, f\' ≠ 0, x₀ proche</td></tr>
<tr><td>A·X = B</td><td>Gauss + pivot partiel</td><td>≈ 2n³/3 opérations</td><td>—</td><td>A inversible</td></tr>

<tr><td>f\'(x)</td><td>Centré</td><td>O(h²)</td><td>—</td><td>f de classe C³</td></tr>
</tbody></table>
<h3>Que choisir ?</h3>
<ul>
<li><b>Racine d\'une équation</b> : dichotomie si on n\'a que f et un intervalle ; Newton si on a f\' et un bon point de départ.</li>
<li><b>Système linéaire</b> : Gauss (ou <code>numpy.linalg.solve</code>) pour les systèmes denses de taille raisonnable.</li>

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Méthode numérique</dt><dd>Algorithme qui calcule une solution approchée d\'un problème mathématique.</dd>
<dt>Itération</dt><dd>Un pas d\'un calcul répété ; on note x_n la valeur à l\'étape n.</dd>
<dt>Tolérance ε</dt><dd>Seuil à partir duquel on considère que la solution est suffisamment précise ; sert de critère d\'arrêt.</dd>
<dt>Convergence</dt><dd>Propriété d\'une suite (x_n) qui tend vers la solution x.</dd>
<dt>Ordre de convergence</dt><dd>Entier p tel que l\'erreur à l\'étape n+1 soit majorée par C·(erreur à l\'étape n)^p.</dd>
<dt>Critère d\'arrêt</dt><dd>Condition qui fait sortir d\'une boucle itérative (|f(x)| &lt; ε, |Δx| &lt; ε, etc.).</dd>
<dt>Erreur de troncature</dt><dd>Erreur due à l\'approximation de la formule exacte.</dd>
<dt>Erreur d\'arrondi</dt><dd>Erreur due à la représentation finie des nombres en machine.</dd>
<dt>Dichotomie</dt><dd>Méthode de recherche de racine par division de l\'intervalle en deux.</dd>
<dt>Méthode de Newton</dt><dd>Itération x_{n+1} = x_n − f(x_n)/f\'(x_n), basée sur la tangente.</dd>
<dt>Pivot de Gauss</dt><dd>Méthode d\'élimination pour résoudre un système linéaire.</dd>
<dt>Pivot partiel</dt><dd>Choix du plus grand coefficient en valeur absolue dans la colonne pour limiter les erreurs.</dd>
<dt>Matrice augmentée</dt><dd>Matrice [A | B] obtenue en accolant le second membre B à la matrice A.</dd>
<dt>Substitution remontante</dt><dd>Résolution d\'un système triangulaire en partant de la dernière équation.</dd>
<dt>Euler explicite</dt><dd>Schéma y_{n+1} = y_n + h·f(t_n, y_n) pour les équations différentielles.</dd>
<dt>Pas (h)</dt><dd>Écart entre deux points successifs de la discrétisation.</dd>
<dt>Schéma d\'ordre p</dt><dd>Schéma dont l\'erreur globale est en O(h^p).</dd>
</dl>` });

}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l\'atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l\'atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }
$('#bAct').addEventListener('click', actToggle);

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : méthodes numériques'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l\'atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Quatre ateliers sur les méthodes numériques du programme SII de CPGE 1<sup>re</sup> année : équations f(x) = 0, systèmes linéaires A·X = B, équations différentielles par Euler explicite, intégration et dérivation numériques.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut, puis ajustez les paramètres et les méthodes.</li><li>Avancez pas à pas (boutons ◀ ▶), lancez la lecture automatique, ou exécutez tout.</li><li>Sur l\'atelier f(x) = 0, réglez la <b>tolérance ε</b> pour voir son effet sur le nombre d\'itérations.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un QCM avec correction.</li><li>Le bouton <b>Cours</b> détaille chaque méthode.</li></ul>' +
    '<h3>Vos données</h3><p>Les réponses au QCM sont mémorisées dans ce navigateur uniquement.</p>' }));
});
(function init() { AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); })();
</script>
